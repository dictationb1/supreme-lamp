              $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $f), [ref]$null, [ref]$errs)
              if ($errs) {
                  foreach ($e in @($errs)) { Write-Host ('::error title=F56-d parse::' + $f + ':' + $e.Extent.StartLineNumber + ':' + $e.Extent.StartColumnNumber + ' ' + $e.Message) }
                  throw ('F56-d: PowerShell syntax error in ' + $f)
              }
          }
          & (Join-Path $env:GITHUB_WORKSPACE 'tests\f56d-search-input.ps1')
          if ($LASTEXITCODE -ne 0) { throw ('F56-d: SEARCH_INPUT lab failed with exit ' + $LASTEXITCODE) }
          & (Join-Path $env:GITHUB_WORKSPACE 'tests\f56d-creds-memory.ps1')
          if ($LASTEXITCODE -ne 0) { throw ('F56-d: creds memory lab failed with exit ' + $LASTEXITCODE) }
          & (Join-Path $env:GITHUB_WORKSPACE 'tests\f56d-post-fetch-e2e.ps1')
          if ($LASTEXITCODE -ne 0) { throw ('F56-d: post-fetch e2e lab failed with exit ' + $LASTEXITCODE) }
          & (Join-Path $env:GITHUB_WORKSPACE 'tests\f56d-aria2-jsonrpc.ps1')
          if ($LASTEXITCODE -ne 0) { throw ('F56-d: aria2 JSON-RPC lab failed with exit ' + $LASTEXITCODE) }
          Write-Host 'F56-d transport labs PASS'
      # [F59 §4] ADDITIVE: the parallel pre-warm + fail-closed verify lab. It
      # exercises the SHIPPED modules (payloads/f59-timing.ps1,
      # payloads/f59-prebuilt-verify.ps1) on a real PowerShell host: concurrent
      # Start-Job/Wait-Job readiness, the fail-closed SHA-256 cells, the
      # startup-timing.jsonl lines and the main.yml structural contract.
      - name: F59 parallel pre-warm + fail-closed asset verify lab
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in @('payloads\f59-timing.ps1', 'payloads\f59-prebuilt-verify.ps1', 'tests\f59-prewarm-parallel.ps1')) {
              $errs = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $f), [ref]$null, [ref]$errs)
              if ($errs) {
                  foreach ($e in @($errs)) { Write-Host ('::error title=F59 parse::' + $f + ':' + $e.Extent.StartLineNumber + ':' + $e.Extent.StartColumnNumber + ' ' + $e.Message) }
                  throw ('F59: PowerShell syntax error in ' + $f)
              }
          }
          & (Join-Path $env:GITHUB_WORKSPACE 'tests\f59-prewarm-parallel.ps1')
          if ($LASTEXITCODE -ne 0) { throw ('F59: prewarm/verify lab failed with exit ' + $LASTEXITCODE) }
          Write-Host 'F59 prewarm + verify lab PASS'

      # ---- F60 LAB (windows-native, single commit status like F57/F56-d): the ----
      # ---- warm-runner PowerShell lab. Proves the parts a text gate cannot: the ----
      # ---- four F60 scripts PARSE, the pin shape is refused when EMPTY (fail-closed), ----
      # ---- Test-F60AssetSha256 rejects a mismatched fixture, secrets are redacted out ----
      # ---- of log text, the service registration takes the IDEMPOTENT branch for an ----
      # ---- existing service, Mount-F60DataDisk takes the already-mounted branch, the ----
      # ---- health probe returns F60_HEALTH_OK / F60_HEALTH_FAILED with injected probes, ----
      # ---- and Get-F60WarmBudgetVerdict implements the three-strike STOP. ----
      - name: F60 warm-runner PS lab (bootstrap pins, idempotence, health, budget strikes)
        timeout-minutes: 15
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = [string]$env:GITHUB_REPOSITORY
          $sha = [string]$env:GITHUB_SHA
          $runId = [string]$env:GITHUB_RUN_ID
          $tok = [string]$env:GH_TOKEN
          $context = 'f60-warm-lab'
          $labState = 'success'
          $labDesc = 'F60 warm-runner PS lab green (pins fail-closed, idempotent branches, health, budget strikes)'
          # Single commit status, same pattern as the F57/F56-d labs: published on
          # success AND failure so a red lab can never read as "no lab ran".
          function Publish-F60Status([string]$state, [string]$description) {
              if (-not $repo -or -not $sha) { Write-Host ('F60: repo/sha unknown (' + $repo + ' @ ' + $sha + ') - status not publishable'); return }
              if (-not $tok) { Write-Host 'F60: GH_TOKEN is empty - the commit status cannot be published (the step result below still stands)'; return }
              if ($description.Length -gt 140) { $description = $description.Substring(0, 137) + '...' }
              $st = @{
                  state       = $state
                  description = $description
                  context     = $context
                  target_url  = ('https://github.com/' + $repo + '/actions/runs/' + $runId)
              } | ConvertTo-Json -Compress
              try {
                  $r = Invoke-RestMethod -Uri ('https://api.github.com/repos/' + $repo + '/statuses/' + $sha) -Method Post -Headers @{ Authorization = ('Bearer ' + $tok); Accept = 'application/vnd.github+json'; 'User-Agent' = 'ghrdp-f60' } -Body $st -ContentType 'application/json' -TimeoutSec 30
                  Write-Host ('F60: commit status "' + $context + '" = ' + $state + ' (id ' + $r.id + ')')
              } catch {
                  Write-Host ('F60: could not publish the "' + $context + '" commit status: ' + $_.Exception.Message)
              }
          }
          try {
              $parseTargets = @(
                  'payloads\f59-prebuilt-verify.ps1', 'scripts\f60-bootstrap.ps1',
                  'scripts\f60-health.ps1', 'scripts\f60-stage-and-start.ps1',
                  'scripts\f60-scrub-runcommand.ps1', 'tests\f60-bootstrap-lab.ps1'
              )
              Write-Host ('F60: parsing ' + $parseTargets.Count + ' PowerShell surfaces for syntax errors')
              foreach ($t in $parseTargets) {
                  $tokens = $null; $errors = $null
                  $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $t), [ref]$tokens, [ref]$errors)
                  if ($errors -and $errors.Count -gt 0) {
                      throw ('F60: ' + $t + ' has ' + $errors.Count + ' parse error(s): ' + (($errors | ForEach-Object { ($_.Extent.StartLineNumber.ToString() + ':' + $_.Message) }) -join ' | '))
                  }
                  Write-Host ('F60: parse OK: ' + $t + ' (' + $tokens.Count + ' tokens)')
              }
              $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\f60-bootstrap-lab.ps1 2>&1
              $code = $LASTEXITCODE
              $out | ForEach-Object { Write-Host ('[F60 lab] ' + $_) }
              if ($code -ne 0) {
                  # Carry the REASON out of the runner: the log blob is not always
                  # reachable, but an ::error:: annotation and the f60-warm-lab
                  # commit-status description are both readable through the API, so a
                  # red lab always names its first failing check.
                  $failLines = @($out | Where-Object { ([string]$_).Contains('[F60 lab] FAIL ') } | ForEach-Object { ([string]$_).Trim() })
                  $tail = @($out | Where-Object { ([string]$_).Contains('F60_LAB_FAILED') } | ForEach-Object { ([string]$_).Trim() })
                  $first = if ($failLines.Count -gt 0) { $failLines[0] } elseif ($tail.Count -gt 0) { $tail[0] } else { ([string]($out | Select-Object -Last 1)).Trim() }
                  foreach ($l in @($failLines | Select-Object -First 3)) {
                      Write-Host ('::error title=F60 lab check::' + (($l -replace "`r", ' ') -replace "`n", ' '))
                  }
                  throw ('F60: tests\f60-bootstrap-lab.ps1 exited ' + $code + ' with ' + $failLines.Count + ' failing check(s); first: ' + $first)
              }
              $txt = ($out | Out-String)
              if ($txt -notmatch 'F60_LAB_OK') { throw 'F60: the bootstrap lab did not report F60_LAB_OK' }
              Write-Host ('F60: lab OK on ' + $PSVersionTable.PSVersion.ToString())
              $pester = $null
              try { $pester = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [Version]'5.0.0' } | Select-Object -First 1 } catch { $pester = $null }
              if ($pester) {
                  Write-Host ('F60: Pester ' + $pester.Version.ToString() + ' available - running tests\f60-bootstrap.Tests.ps1')
                  Import-Module -Name $pester.Path -Force
                  $cfg = New-PesterConfiguration
                  $cfg.Run.Path = 'tests\f60-bootstrap.Tests.ps1'
                  $cfg.Run.PassThru = $true
                  $cfg.Output.Verbosity = 'Detailed'
                  $res = Invoke-Pester -Configuration $cfg
                  if ($res.FailedCount -gt 0) {
                      $names = @($res.Failed | ForEach-Object { $_.Name }) -join '; '
                      throw ('F60: Pester reported ' + $res.FailedCount + ' failure(s): ' + $names)
                  }
                  Write-Host ('F60: Pester OK (' + $res.PassedCount + ' passed)')
              } else {
                  Write-Host '::warning title=F60 Pester unavailable::Pester 5+ is not installed on this runner image, so tests\f60-bootstrap.Tests.ps1 did not run; the hand-rolled tests\f60-bootstrap-lab.ps1 covered the same four behaviours (param validation, fail-closed pins, idempotent branches, health + budget strikes)'
              }
              # [F60 §5] PSScriptAnalyzer over the four shipped F60 scripts.
              # ERROR severity fails the lab (that is the "analyzer clean" contract).
              # Warning/Information findings are REPORTED, not failed: the house style
              # already ships Initialize-/Resolve-/Stage- verbs (payloads/ghrdp-qbt.ps1,
              # payloads/ghrdp-server.ps1) and deliberate empty catch blocks, and
              # renaming those would break the F59 dot-source contract for no safety
              # gain - so PSUseApprovedVerbs is the one documented exclusion.
              $analyzer = $null
              try { $analyzer = Get-Module -ListAvailable -Name PSScriptAnalyzer | Select-Object -First 1 } catch { $analyzer = $null }
              if (-not $analyzer) {
                  try {
                      Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber -SkipPublisherCheck -ErrorAction Stop
                      $analyzer = Get-Module -ListAvailable -Name PSScriptAnalyzer | Select-Object -First 1
                  } catch { $analyzer = $null }
              }
              if ($analyzer) {
                  Import-Module -Name $analyzer.Path -Force
                  Write-Host ('F60: PSScriptAnalyzer ' + $analyzer.Version.ToString() + ' over the four F60 scripts')
                  $anTargets = @('scripts\f60-bootstrap.ps1', 'scripts\f60-health.ps1', 'scripts\f60-stage-and-start.ps1', 'scripts\f60-scrub-runcommand.ps1')
                  $anSettings = @{ ExcludeRules = @('PSUseApprovedVerbs') }
                  $anAll = @()
                  foreach ($a in $anTargets) {
                      $anAll += @(Invoke-ScriptAnalyzer -Path $a -Settings $anSettings)
                  }
                  $anErr = @($anAll | Where-Object { [string]$_.Severity -eq 'Error' })
                  $anWarn = @($anAll | Where-Object { [string]$_.Severity -eq 'Warning' })
                  $anInfo = @($anAll | Where-Object { [string]$_.Severity -eq 'Information' })
                  Write-Host ('F60: analyzer findings error=' + $anErr.Count + ' warning=' + $anWarn.Count + ' information=' + $anInfo.Count)
                  foreach ($f in @($anAll | Select-Object -First 40)) {
                      Write-Host ('F60:   [' + $f.Severity + '] ' + $f.RuleName + ' @ ' + (Split-Path -Leaf $f.ScriptPath) + ':' + $f.Line + ' - ' + $f.Message)
                  }
                  if ($anErr.Count -gt 0) {
                      $names = @($anErr | ForEach-Object { ($_.RuleName + '@' + (Split-Path -Leaf $_.ScriptPath) + ':' + $_.Line) }) -join '; '
                      throw ('F60: PSScriptAnalyzer reported ' + $anErr.Count + ' Error-severity finding(s): ' + $names)
                  }
                  if ($env:GITHUB_STEP_SUMMARY) {
                      Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('- F60 PSScriptAnalyzer: 0 errors, ' + $anWarn.Count + ' warnings, ' + $anInfo.Count + ' informational (PSUseApprovedVerbs excluded by design)' + "`n")
                  }
              } else {
                  Write-Host '::warning title=F60 PSScriptAnalyzer unavailable::PSScriptAnalyzer could not be found or installed on this runner image, so the four F60 scripts were not analyzer-checked; the parse gate and the behavioural lab above still ran'
              }
          } catch {
              $labState = 'failure'
              $msg = [string]$_.Exception.Message
              if ($msg.Length -gt 200) { $msg = $msg.Substring(0, 200) }
              $labDesc = 'F60 warm-runner PS lab red: ' + $msg
              Write-Host ('::error title=F60 lab::' + $msg)
              Write-Host ('F60 LAB FAIL CONTEXT: ' + $_.ScriptStackTrace)
          }
          Publish-F60Status -state $labState -description $labDesc
          if ($labState -ne 'success') { exit 1 }
          Write-Host ('F60 windows-native lab GREEN on ' + $PSVersionTable.PSVersion.ToString() + ' (context ' + $context + ')')

  rdp-lab-check:
    name: RDP Verification Lab Check
    uses: ./.github/workflows/rdp-lab.yml
    with:
      profile: static
      source_sha: ${{ github.sha }}
