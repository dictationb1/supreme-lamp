      # [F24] The F24 blocks live INSIDE main.yml (inline pwsh) and are extracted
      # verbatim by the lab cell U + the F24 gate. Parse them here with the
      # PowerShell language parser so a syntax error is caught in ~1 min instead
      # of after a 20-minute lab run. This step never executes them.
      - name: Parse the F24 extracted blocks (main.yml inline PowerShell)
        shell: pwsh
        run: |
          $wf = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE '.github/workflows/main.yml'))
          function Get-Block([string]$Begin, [string]$End) {
              $a = $wf.IndexOf($Begin)
              $b = $wf.IndexOf($End, [Math]::Max($a, 0))
              if ($a -lt 0 -or $b -lt 0 -or $b -le $a) { throw ('F24 marker missing in main.yml: ' + $Begin) }
              return ((($wf.Substring($a, $b - $a)) -split "`r?`n") | Where-Object { $_ -notmatch 'begin\]|end\]' } | ForEach-Object { $_ -replace '^\s+', '' }) -join "`n"
          }
          foreach ($pair in @(@('# [F24 §1 cred-proof-begin]', '# [F24 §1 cred-proof-end]'), @('# [F24 §2 collector-begin]', '# [F24 §2 collector-end]'))) {
              $text = Get-Block $pair[0] $pair[1]
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$null, [ref]$errors)
              if ($errors -and $errors.Count -gt 0) { throw ($pair[0] + ' has ' + $errors.Count + ' PowerShell syntax error(s): ' + $errors[0].Message) }
              Write-Host ('[F24] extracted block parses OK: ' + $pair[0] + ' (' + $text.Length + ' chars)')
          }
      # [F28 §1] The logon scanner lives inside payloads/ghrdp-server.ps1 and is
      # extracted VERBATIM, parsed by the PowerShell language parser and driven
      # with synthetic 4624/4625 events - the parse path is proven without a
      # live Security log and without any credential material.
      - name: F28 server-side logon scanner (extract + synthetic events)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $srv = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-server.ps1'))
          $a = $srv.IndexOf('# [F28 §1 scanner-begin]')
          $b = $srv.IndexOf('# [F28 §1 scanner-end]', [Math]::Max($a, 0))
          if ($a -lt 0 -or $b -le $a) { throw 'F28: the scanner markers are missing from ghrdp-server.ps1' }
          $block = $srv.Substring($a, $b - $a)
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseInput($block, [ref]$null, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) { throw ('F28 scanner block has ' + $errors.Count + ' syntax error(s): ' + $errors[0].Message) }
          . ([scriptblock]::Create($block))
          if (-not (Get-Command Get-RdpLogonAuthLast -ErrorAction SilentlyContinue)) { throw 'F28: Get-RdpLogonAuthLast was not defined by the extracted block' }
          $start = (Get-Date).ToUniversalTime()
          function New-F28Event([int]$Id, [string]$TimeUtc, [string]$LogonType, [string]$Status, [string]$SubStatus, [string]$Target) {
              $tpl = '<Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><EventID>{ID}</EventID><TimeCreated SystemTime="{T}"/></System><EventData><Data Name="LogonType">{LT}</Data><Data Name="Status">{ST}</Data><Data Name="SubStatus">{SUB}</Data><Data Name="FailureReason">%%2313</Data><Data Name="TargetUserName">{TU}</Data><Data Name="SubjectUserName">must-not-leak</Data></EventData></Event>'
              $xml = $tpl.Replace('{ID}', [string]$Id).Replace('{T}', $TimeUtc).Replace('{LT}', $LogonType).Replace('{ST}', $Status).Replace('{SUB}', $SubStatus).Replace('{TU}', $Target)
              return (Get-RdpLogonEventFields -Xml ([xml]$xml))
          }
          function Iso([int]$DeltaSec) { return $start.AddSeconds($DeltaSec).ToString('o') }
          $fail = New-F28Event 4625 (Iso -30) '3' '0xC000006D' '0xC000006A' 'decoy-user'
          $ok = New-F28Event 4624 (Iso -10) '10' '' '' 'decoy-user'
          $console = New-F28Event 4624 (Iso -5) '3' '' '' 'decoy-user'
          $stale = New-F28Event 4625 (Iso -4000) '3' '0xC000006D' '0xC000006A' 'decoy-user'
          $a1 = Get-RdpLogonAuthLast -Items @($fail) -ScanStartedUtc $start
          if ($a1.result -ne 'failed') { throw ('F28: a rejected password must stamp failed, got ' + $a1.result) }
          if ($a1.sub -ne '0XC000006A' -or $a1.subMeaning -ne 'wrong-password') { throw ('F28: sub/subMeaning wrong: ' + $a1.sub + '/' + $a1.subMeaning) }
          if (-not $a1.scanTs -or -not $a1.eventTs) { throw 'F28: a failed verdict without scanTs/eventTs' }
          if (-not ([string]$a1.scanTs).EndsWith('Z')) { throw ('F28: scanTs is not a Z-suffixed UTC stamp: ' + $a1.scanTs) }
          $a2 = Get-RdpLogonAuthLast -Items @($fail, $ok) -ScanStartedUtc $start
          if ($a2.result -ne 'success') { throw ('F28: a NEWER type-10 logon must supersede the failure, got ' + $a2.result) }
          if ($a2.count4624 -ne 1 -or $a2.count4625 -ne 1) { throw 'F28: event counts are wrong' }
          $a3 = Get-RdpLogonAuthLast -Items @() -ScanStartedUtc $start
          if ($a3.result -ne 'none' -or -not $a3.scanTs) { throw 'F28: an empty window must still stamp scanTs (never a dead-collector reading)' }
          $a4 = Get-RdpLogonAuthLast -Items @() -ScanStartedUtc $start -ProbeError 'security-log-unreadable'
          if ($a4.probeError -ne 'security-log-unreadable' -or -not $a4.scanTs) { throw 'F28: a probe error must be reported AND still stamp scanTs' }
          $a5 = Get-RdpLogonAuthLast -Items @($console) -ScanStartedUtc $start
          if ($a5.result -ne 'none' -or $a5.count4624 -ne 0) { throw ('F28: a type-3 (console) logon counted as an RDP success: ' + $a5.result) }
          $a6 = Get-RdpLogonAuthLast -Items @($stale) -ScanStartedUtc $start
          if ($a6.result -ne 'none') { throw 'F28: a pre-window failure leaked into the verdict' }
          if ((($a1 | ConvertTo-Json -Depth 5)) -match '"SubjectUserName"') { throw 'F28: the verdict carries a subject identity field' }
          if (-not $block.Contains('$script:F28IntervalSec = 30')) { throw 'F28: the 30s interval is not declared in the scanner block' }
          Write-Host ('[F28] scanner PASS: 0xC000006A => ' + $a1.result + ' sub=' + $a1.sub + ' scanTs=' + $a1.scanTs + ' | newer type-10 => ' + $a2.result + ' | empty => ' + $a3.result + ' | probeError => ' + $a4.probeError + ' | console-type3 ignored, pre-window ignored')

      # [F28 §3] The closed fallback gap, executed: the SHIPPED launcher is
      # compiled by the same in-box csc install.cmd uses and its
      # --fallback-selftest runs the production decision function (the one
      # DoWork/RecredStep call) through the full matrix - with zero mstsc and
      # zero cmdkey calls.
      - name: F28 launcher fallback-gap decision matrix (csc compile + --fallback-selftest)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) { $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework\v4.0.30319\csc.exe' }
          if (-not (Test-Path -LiteralPath $csc)) { throw 'the in-box csc.exe is missing (install.cmd depends on it too)' }
          $exe = Join-Path $env:RUNNER_TEMP 'ghrdp-rdp-launcher-f28.exe'
          $out = Join-Path $env:RUNNER_TEMP 'ghrdp-f28-fallback.txt'
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Force }
          $cs = Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-rdp-launcher.cs'
          $cscOut = (& $csc /nologo /target:winexe /out:$exe /r:System.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll $cs 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw ('csc exit ' + $LASTEXITCODE + ' :: ' + $cscOut.Trim()) }
          $env:GHRDP_LAB_OUT = $out
          $env:GHRDP_LAB_NOMSG = '1'
          $p = Start-Process -FilePath $exe -ArgumentList '--fallback-selftest' -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw ('--fallback-selftest exit ' + $p.ExitCode) }
          for ($i = 0; $i -lt 20 -and -not (Test-Path -LiteralPath $out); $i++) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path -LiteralPath $out)) { throw '--fallback-selftest wrote no matrix file' }
          $txt = Get-Content -LiteralPath $out -Raw
          Write-Host $txt
          foreach ($want in @(
              'storeMissing=false ticketPresent=false retryRedeemOk=false decision=mstsc expected=mstsc nativePrompt=false beacon=(none) verdict=pass',
              'storeMissing=true ticketPresent=true retryRedeemOk=false decision=native-prompt expected=native-prompt nativePrompt=true beacon=fallback-mstsc-native-prompt verdict=pass',
              'storeMissing=true ticketPresent=true retryRedeemOk=true decision=mstsc expected=mstsc nativePrompt=false beacon=(none) verdict=pass',
              'storeMissing=true ticketPresent=false retryRedeemOk=false decision=native-prompt expected=native-prompt nativePrompt=true beacon=fallback-mstsc-native-prompt verdict=pass'
          )) { if (-not $txt.Contains($want)) { throw ('F28 matrix case missing: ' + $want) } }
          if (-not $txt.Contains('mstscLaunched=0 cmdkeyCalled=0')) { throw 'F28: the selftest touched mstsc/cmdkey' }
          if ($txt -like '*verdict=FAIL*') { throw 'F28: a fallback matrix case reported FAIL' }
          Write-Host '[F28] fallback-gap decision matrix: 4/4 pass (stored=false can never reach a silent mstsc; no mstsc, no cmdkey)'

