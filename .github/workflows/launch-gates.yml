name: launch-gates
on:
  pull_request:
  push:
permissions:
  contents: read
  statuses: write
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: F31/F33 persisted-key ACL and served-certificate gates
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          acl=payloads/Grant-RdpKeyAccess.ps1
          probe=payloads/Test-RdpListenerHandshake.ps1
          for token in PersistKeySet MachineKeySet Exportable HasPrivateKey Grant-RdpKeyAccess.ps1 'Restart-Service TermService -Force -ErrorAction Stop'; do
            grep -qF "$token" "$wf"
          done
          for token in 'GetRSAPrivateKey' 'GetECDsaPrivateKey' 'Crypto\Keys' 'RSA\MachineKeys' 'S-1-5-20' 'S-1-5-18' 'Set-Acl' 'GetAccessRules' 'Required ACE absent'; do
            grep -qF "$token" "$acl"
          done
          for token in '0x03,0x00,0x00,0x13' '0x0e,0xe0' 'AuthenticateAsClientAsync' 'IsAuthenticated' 'SslPolicyErrors' '36870' 'key ACL:'; do
            grep -qF "$token" "$probe"
          done
          grep -qF 'listenerHandshakeOk = $listenerHandshakeOk' "$wf"
          grep -qF 'listenerHandshakeOk=false' "$wf"
          grep -qF 'listener-handshake-ok' "$wf"
          grep -qF 'F33 ACL-DENIED PASS' .github/workflows/autologin-lab.yml
          grep -qF 'Id = @(36870, 36871, 36888)' payloads/ghrdp-server.ps1
          grep -qF 'key-open-failed:' payloads/ghrdp-server.ps1
          grep -qF 'tls-alert-sent:' payloads/ghrdp-server.ps1
          if grep -E 'UserAuthentication -Value 0|SecurityLayer -Value 0|IgnoreCertificateErrors' "$wf" "$acl" "$probe"; then exit 1; fi

      - name: D/E launch gates
        shell: bash
        run: |
          set -euo pipefail
          # [F12-1] ban script-host EXECUTION tokens, not the mere word: the
          # §1.4 stale-registration notice must be able to name the old handler.
          if grep -E -n 'powershell\.exe|-ExecutionPolicy|Invoke-Expression|-EncodedCommand|mshta|wscript|cscript' payloads/ui.html; then
            echo 'ui.html still contains a script-host launch' >&2
            exit 1
          fi
          if grep -E -n 'dnsName = \$ip|dnsName = \[string\]\$ip' .github/workflows/main.yml; then
            echo 'dnsName assigned from an IP' >&2
            exit 1
          fi
          if grep -E -n 'fqdnN = \[string\]\$cfgN.rdpIp|rdpTarget = \[string\]\$cfgC.rdpIp' payloads/ghrdp-server.ps1; then
            echo 'native target still falls back to rdpIp' >&2
            exit 1
          fi
          grep -q 'hostKind = $hostKind' payloads/ghrdp-server.ps1
          grep -q "hostKind = 'ephemeral'" .github/workflows/main.yml
          if grep -E -n 'RUN SETUP|RUN INSTALL' payloads/ui.html; then
            echo 'ui.html still references RUN SETUP / RUN INSTALL buttons' >&2
            exit 1
          fi
          if grep -E -n "reasons \+= 'handler-not-seen'|handler-not-seen'" payloads/ghrdp-server.ps1; then
            echo 'ghrdp-server.ps1 still builds a handler-hello reason' >&2
            exit 1
          fi
      - name: F10 PS-free launch / gated creds / bookmark gates
        shell: bash
        run: |
          set -euo pipefail
          # §1.3 launch-gate: no script-host launch anywhere in the page or the
          # new launcher assets.
          if grep -E -n 'powershell\.exe|-ExecutionPolicy|Invoke-Expression|-EncodedCommand|mshta|wscript|cscript' payloads/ui.html payloads/ghrdp-rdp-launcher.cs payloads/install.cmd; then
            echo 'F10: script-host launch token found' >&2; exit 1
          fi
          # §1 install.cmd: in-box csc + HKCU ghrdp registration, nothing else.
          grep -q 'Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe' payloads/install.cmd
          grep -q 'HKCU\\Software\\Classes\\ghrdp' payloads/install.cmd
          # §1.2 .rdp directive contract (+ no password/hash lines, no resolution pins).
          for d in 'screen mode id:i:2' 'redirectclipboard:i:1' 'redirectprinters:i:1' 'redirectdrives:i:1' 'drivestoredirect:s:*' 'devicestoredirect:s:*' 'redirectcomports:i:1' 'redirectsmartcards:i:1' 'redirectposdevices:i:1' 'audiocapturemode:i:1' 'bandwidthautodetect:i:1' 'compression:i:1'; do
            grep -qF "$d" payloads/ghrdp-rdp-launcher.cs || { echo "F10: missing rdp directive $d" >&2; exit 1; }
          done
          # (comments legitimately NAME the omitted directives - strip them)
          if grep -v '^[[:space:]]*//' payloads/ghrdp-rdp-launcher.cs | grep -E -n 'password 51|desktopwidth|desktopheight|prompt for credentials'; then
            echo 'F10: launcher writes a forbidden .rdp line' >&2; exit 1
          fi
          # §3 creds: served ONLY at the /api/config creds-block write site,
          # gated by Test-CredsAllowed (token or tailnet source).
          grep -q 'function Test-CredsAllowed' payloads/ghrdp-server.ps1
          test "$(grep -c 'credsAllowed' payloads/ghrdp-server.ps1)" -ge 3
          test "$(grep -cn 'windowsPass' payloads/ghrdp-server.ps1)" -eq 2
          # §2 server fields + ping loop + client-peer capture.
          grep -q 'rdpLogonAgeSec' payloads/ghrdp-server.ps1
          grep -q 'pingPath' payloads/ghrdp-server.ps1
          grep -q 'dash-client-ip.txt' payloads/ghrdp-server.ps1
          # [F95 §3.1 / R1] SUPERSEDED PIN (rewritten in place, not deleted).
          # Was: grep -q 'LogonType=10' payloads/ghrdp-server.ps1
          # That pin is what kept the logon probe over-strict: it rewarded the
          # very filter that made an AutoAdminLogon (LogonType 2) desktop read
          # as "no user logged in". The pin now asserts the ACCEPTED SET and
          # forbids a bare type-10-only Win32_LogonSession filter from coming
          # back.
          grep -q "GhrdpLogonSessionWql = 'LogonType=2 OR LogonType=10 OR LogonType=11'" payloads/ghrdp-server.ps1
          grep -q "GhrdpInteractiveLogonTypes = @('2', '10', '11')" payloads/ghrdp-server.ps1
          if grep -qE "Win32_LogonSession -Filter 'LogonType=10'" payloads/ghrdp-server.ps1; then
            echo 'F95/R1: a type-10-only Win32_LogonSession filter is back - autologon (type 2) would read as no session' >&2
            exit 1
          fi
          grep -q 'rdpLogonAgeSec' payloads/ui.html
          grep -q 'UDP 41641' payloads/ui.html
          grep -q 'compression=6' payloads/ui.html
          grep -q 'credWinPass' payloads/ui.html
          # §2.3 latency keys in the webdesk step.
          grep -q 'PollUnderCursor' .github/workflows/main.yml
          grep -q 'CompareFB' .github/workflows/main.yml
          # §4.2 gate: no piracy-index bookmark strings anywhere in main.yml.
          # [F11-5.2] narrowed: the plain qBittorrent app is allowed, piracy
          # INDEX strings/URLs and torrent bookmarks stay banned.
          if grep -E -i -n 'fmhy|megathread|1337x|thepiratebay|pirate ?bay|rarbg|torrentz|kickass' .github/workflows/main.yml; then
            echo 'F10/F11: piracy-index string in main.yml' >&2; exit 1
          fi
          if grep -nE "name = '[^']*[Tt]orrent[^']*'" .github/workflows/main.yml; then
            echo 'F11: a torrent bookmark reappeared' >&2; exit 1
          fi
          grep -q 'ExtensionInstallForcelist' .github/workflows/main.yml
          # F10-11: ONE live resolver, dot-sourced by both the provisioning
          # workflow and the proof lane, with no literal 32-char id in the repo
          # (a hardcoded id is exactly what §4.1 forbids).
          grep -q 'edge-ext-resolve.ps1' .github/workflows/main.yml
          grep -q 'edge-ext-resolve.ps1' .github/workflows/autologin-lab.yml
          grep -q 'Resolve-StoreExtId' .github/workflows/main.yml
          test -f payloads/edge-ext-resolve.ps1
          grep -q 'Get-ExtForceListValue' payloads/edge-ext-resolve.ps1
          if grep -nE '[a-p]{32}' payloads/edge-ext-resolve.ps1; then
            echo 'F10: literal extension id in the resolver (must be discovered live)' >&2; exit 1
          fi
          if grep -nE '[a-p]{32}' .github/workflows/main.yml; then
            echo 'F10: literal extension id in main.yml' >&2; exit 1
          fi
          grep -q 'login.tailscale.com/admin/dns' .github/workflows/main.yml
          grep -q 'docs/AUTOLOGIN.md' .github/workflows/main.yml
          # F10-9: the lab harness must never block on the mstsc descendant
          # (Start-Process -Wait wedged proof step B/C in run 36147990362).
          if grep -q -- '-PassThru -Wait' .github/workflows/autologin-lab.yml; then
            echo 'F10: lab harness waits on the mstsc descendant (wedges the runner)' >&2; exit 1
          fi
          grep -q 'WaitForExit(90000)' .github/workflows/autologin-lab.yml
          grep -q 'mstsc reaped' .github/workflows/autologin-lab.yml
          # F10-10: the launcher beacon is bounded (never a wedge).
          grep -q 'HelloBounded' payloads/ghrdp-rdp-launcher.cs
          # §5 setup caches present.
          grep -q 'actions/cache@v4' .github/workflows/main.yml
          echo 'F10 gates PASS'
      - name: F11-2 VNC password memory gates (shim + postMessage, no URL creds)
        shell: bash
        run: |
          set -euo pipefail
          shim=payloads/ghrdp-cred-shim.js
          test -f "$shim"
          # §2.1 shim: opener + exact-origin gate, auto-submit, purge.
          grep -q "type !== 'ghrdp-vnc-pass'" "$shim"
          grep -q 'ev.source !== window.opener' "$shim"
          grep -q 'originAllowed(ev.origin)' "$shim"
          grep -q 'sendCredentials' "$shim"
          grep -q 'noVNC_password_input' "$shim"
          grep -q 'noVNC_credentials_dialog' "$shim"
          grep -q 'pending = null' "$shim"
          grep -q 'window.opener = null' "$shim"
          grep -q 'ghrdp-cred-origin' "$shim"
          # §2.2 never logs/echoes the value: no console/log/alert/document.title.
          if grep -vE '^[[:space:]]*(/\*|\*|//)' "$shim" | grep -nE 'console\.|alert\(|document\.title|innerHTML'; then
            echo 'F11-2: the shim must never log or echo the VNC password' >&2
            exit 1
          fi
          # §2 deploy: the shim is copied INTO the served noVNC copy and the
          # script tag + exact origin meta are injected, idempotently.
          grep -q "payloads\\\\ghrdp-cred-shim.js" .github/workflows/main.yml
          grep -q 'ghrdp-cred-shim.js' .github/workflows/main.yml
          grep -qF 'meta name="ghrdp-cred-origin"' .github/workflows/main.yml
          grep -q "http://' + \$rdpIp + ':7331'" .github/workflows/main.yml
          # §2.3 dashboard: localStorage memory + postMessage with EXACT
          # targetOrigin; the launch URL itself must never carry a password.
          grep -q 'ghrdp.vncPass' payloads/ui.html
          grep -q 'ghrdp-vnc-pass' payloads/ui.html
          grep -q 'origin=new URL(url).origin' payloads/ui.html
          grep -q "w.postMessage({type:'ghrdp-vnc-pass',pass:pass},origin)" payloads/ui.html
          grep -q 'targetOrigin' payloads/ui.html
          if grep -nE "vnc\.html[^\"']*(password|pass)=|(password|pass)=[^\"']*vnc\.html" payloads/ui.html .github/workflows/main.yml; then
            echo 'F11-2: a noVNC launch URL carries a credential parameter' >&2
            exit 1
          fi
          # The dashboard must NOT use rel/noopener for the webdesk launch (the
          # shim authenticates window.opener), and the shim must drop the opener.
          if grep -nE "window\.open\(openUrl,'_blank','noopener'\)" payloads/ui.html; then
            echo 'F11-2: webdesk launch must keep window.opener for the shim handoff' >&2
            exit 1
          fi
          echo 'F11-2 gates PASS'
      - name: F11-3 RDP usage timer gates (accumulator, freeze, persistence)
        shell: bash
        run: |
          set -euo pipefail
          srv=payloads/ghrdp-server.ps1
          grep -q 'rdp-usage.ps1' "$srv"
          grep -q 'rdp-usage.json' "$srv"
          grep -q 'Test-RdpConnected' "$srv"
          grep -q 'Test-WebdeskClient' "$srv"
          grep -q 'qwinsta.exe' "$srv"
          grep -q 'ws-clients.txt' "$srv"
          grep -q 'websockify.log' "$srv"
          grep -q '\$sec = \$sec + 5' "$srv"
          grep -q 'Start-Sleep -Seconds 5' "$srv"
          # accumulator persists into config.json on stop + every 30s while live
          grep -q "rdpUsageSec', \$sec" "$srv"
          grep -q 'rdpUsageHost' "$srv"
          grep -q 'rdpUsageActive' "$srv"
          grep -q 'rdpUsageSec = \$carryUsage' .github/workflows/main.yml
          grep -q 'rdpUsageSec carried forward' .github/workflows/main.yml
          # UI headline is RDP USAGE (logon age kept only as a fallback)
          grep -q 'RDP USAGE' payloads/ui.html
          grep -q 'id="timerRdpUsage"' payloads/ui.html
          grep -q 'window.__rdpUsage' payloads/ui.html
          grep -q 'window.__rdpLogon' payloads/ui.html
          echo 'F11-3 gates PASS'
      - name: F11-4 connectivity gates (15s ping loop, direct/relay, compression=6)
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'tailscale ping -c 1 -timeout 3s' payloads/ghrdp-server.ps1
          grep -q 'Start-Sleep -Seconds 15' payloads/ghrdp-server.ps1
          grep -q "path = 'relay'" payloads/ghrdp-server.ps1
          grep -q "path = 'direct'" payloads/ghrdp-server.ps1
          grep -q 'pingMs' payloads/ghrdp-server.ps1
          grep -q 'pingPath' payloads/ui.html
          grep -q 'UDP 41641' payloads/ui.html
          grep -q 'srv .*ms' payloads/ui.html
          grep -q 'connFps' payloads/ui.html
          grep -q 'wire.rtt' payloads/ui.html
          grep -q 'compression=6' payloads/ui.html
          grep -q 'PollUnderCursor' .github/workflows/main.yml
          grep -q 'CompareFB' .github/workflows/main.yml
          echo 'F11-4 gates PASS'
      - name: F11-5/6 provisioning + setup-time gates (hidden helpers, no mirror)
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          # §5.3 every host-helper launch is hidden (or NoNewWindow for the
          # user-driven terminal exec / msiexec probes): no bare Start-Process.
          if grep -n 'Start-Process' "$wf" | grep -v '^\s*[0-9]*:\s*#' | grep -vE 'WindowStyle Hidden|NoNewWindow'; then
            echo 'F11-5.3: a host-helper launch lacks the hidden/SYSTEM form' >&2
            exit 1
          fi
          # background loops in the server always launch hidden
          for helper in wire-probe.ps1 rdp-ping.ps1 rdp-usage.ps1; do
            grep -q "'-File',(Join-Path \$Root '$helper') -WindowStyle Hidden" payloads/ghrdp-server.ps1 || {
              echo "F11-5.3: $helper is not launched hidden" >&2; exit 1; }
          done
          # SYSTEM scheduled tasks for the long-lived services (dashboard,
          # rust dash) + hidden background helpers in the server itself.
          grep -q "UserId 'SYSTEM'" "$wf"
          grep -q "LogonType ServiceAccount" "$wf"
          if grep -n 'Start-Process' payloads/ghrdp-server.ps1 | grep -v 'NoNewWindow' | grep -v 'WindowStyle Hidden'; then
            echo 'F11-5.3: a server-launched helper lacks the hidden form' >&2
            exit 1
          fi
          # §5.2 qBittorrent is a plain cached app and NEVER wired to a mirror.
          grep -q 'qBittorrent.qBittorrent' "$wf"
          grep -q 'winget download --id qBittorrent.qBittorrent' "$wf"
          grep -q 'cache\\qbittorrent' "$wf"
          if grep -nE 'qBittorrent[^\n]*(Web UI|webui|--webui|8080)' "$wf"; then
            echo 'F11-5.2: qBittorrent must stay a plain app (no Web UI wiring)' >&2
            exit 1
          fi
          # Mirror stays OFF: MIRROR_INPUT only ever compared to 'true', no
          # mirror input in workflow_dispatch, no reintroduced publish step.
          grep -q "MIRROR_INPUT -eq 'true'" "$wf"
          if grep -nE "MIRROR_INPUT'? *(-ne|-eq) *'?(true|false)'?" "$wf" | grep -v "MIRROR_INPUT -eq 'true'"; then
            echo 'F11-5.2: mirror default must stay OFF (only -eq true)' >&2
            exit 1
          fi
          if awk '/^on:/{f=1} /^permissions:/{f=0} f' "$wf" | grep -qE '^\s+mirror:'; then
            echo 'F11-5.2: a mirror dispatch input reappeared' >&2
            exit 1
          fi
          if grep -nE '^\s*Publish-AllIndexes' "$wf" | grep -v 'try {'; then
            echo 'F11-5.2: a mirror publish step reappeared outside the disabled path' >&2
            exit 1
          fi
          # §6 setup-time report + merged start/cache step + event wait.
          grep -q 'Setup time report (F11-6)' "$wf"
          grep -q 'provisioning finished in' "$wf"
          grep -q 'Record job start + pre-create cache directories' "$wf"
          grep -q 'service registered=' "$wf"
          echo 'F11-5/6 gates PASS'
      - name: F12 close-out gates (handler overwrite, cert fail-closed, all-browser, qb assoc, vnc memory)
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          lab=.github/workflows/autologin-lab.yml
          shim=payloads/ghrdp-cred-shim.js
          # --- §1.1 stale-handler overwrite (exe wins over any prior value) -----
          # [F14] tokens re-pinned to the byte-faithful F14 install.cmd text
          # (BEFORE/AFTER printed + HKCU overwrite; no find-based readback).
          grep -q 'echo BEFORE: & reg query' payloads/install.cmd
          grep -q 'echo AFTER: & reg query' payloads/install.cmd
          grep -q 'HKCU\\Software\\Classes\\ghrdp' payloads/install.cmd
          grep -qF 'reg query "HKCU\Software\Classes\ghrdp\shell\open\command" /ve 2>nul' payloads/install.cmd
          grep -qF 'reg add "HKCU\Software\Classes\ghrdp\shell\open\command"' payloads/install.cmd
          # --- §1.4 stale-registration notice (20s hello-beacon watch) ----------
          grep -q 'id="winAutoStale"' payloads/ui.html
          grep -q 'stale ghrdp registration' payloads/ui.html
          grep -q '__helloWatchArmedAt' payloads/ui.html
          grep -q 'lastHandlerVerb' payloads/ui.html
          grep -q '20000);' payloads/ui.html
          # --- §2 cert bind: ordering proof + 3x10s retry + fail-closed ---------
          dns_line=$(grep -n 'name: Wait for Tailscale connected' "$wf" | head -1 | cut -d: -f1)
          cert_line=$(grep -n 'name: Bind tailnet LE cert to RDP-Tcp' "$wf" | head -1 | cut -d: -f1)
          test -n "$dns_line"
          test -n "$cert_line"
          test "$dns_line" -lt "$cert_line"
          grep -q "TS_MAGICDNS_FQDN=' + \$dnsName" "$wf"
          # [F21] terminate cert body at the next step (CredSSP verification,
          # added in F21) OR at the Optimize Tailscale path step, whichever
          # comes first - F21's own exit 0 must not be counted here.
          cert_body=$(awk '/name: Bind tailnet LE cert to RDP-Tcp/{f=1;next} f && (/^      - name: CredSSP\/NLA handshake verification/ || /^      - name: Optimize Tailscale path/){exit} f' "$wf")
          echo "$cert_body" | grep -q 'TS_MAGICDNS_FQDN'
          echo "$cert_body" | grep -q 'for ($attempt = 1; $attempt -le 3; $attempt++)'
          echo "$cert_body" | grep -q 'Start-Sleep -Seconds 10'
          echo "$cert_body" | grep -q 'reason cert-not-bound'
          echo "$cert_body" | grep -q 'Thumbprint:'
          # only ONE exit 0 may survive in the cert step: the success path.
          test "$(echo "$cert_body" | grep -cE '^[[:space:]]*exit 0[[:space:]]*$')" -eq 1
          # --- §3.1/§3.2 all-browser provisioning (live ids at build time) ------
          grep -q 'ExtensionInstallForcelist' "$wf"
          grep -q 'Resolve-AmoAddon' payloads/edge-ext-resolve.ps1
          grep -q 'Resolve-AmoAddon -Slug' "$wf"
          grep -q "Resolve-AmoAddon -Slug 'ublock-origin'" "$wf"
          grep -q "Resolve-AmoAddon -Slug 'darkreader'" "$wf"
          if grep -nE 'uBlock0@raymondhill|addon@darkreader|addons\.mozilla\.org/firefox/downloads' "$wf"; then
            echo 'F12-3: a hardcoded Firefox add-on id or download URL reappeared' >&2; exit 1
          fi
          grep -q 'Get-ForcedEntryCount' "$wf"
          grep -q 'ExtensionSettings' "$wf"
          # --- §3.3/§3.4 bookmarks untouched + qBittorrent default handler ------
          grep -q 'ghrdp-provision-apps.ps1' "$wf"
          grep -q 'ghrdp-provision-apps.ps1' "$lab"
          grep -q 'Set-QbittorrentDefaultHandler' payloads/ghrdp-provision-apps.ps1
          grep -q 'Set-QbittorrentDefaultHandler' "$wf"
          grep -q 'Set-QbittorrentDefaultHandler' "$lab"
          grep -q 'HKEY_CLASSES_ROOT\\magnet\\shell\\open\\command' payloads/ghrdp-provision-apps.ps1
          grep -q 'HKEY_CLASSES_ROOT\\.torrent' payloads/ghrdp-provision-apps.ps1
          grep -q 'URL Protocol' payloads/ghrdp-provision-apps.ps1
          grep -q 'Get-ForcedEntryCount' payloads/ghrdp-provision-apps.ps1
          grep -q 'Test-ForcedEntryShape' payloads/ghrdp-provision-apps.ps1
          if grep -nE 'magnet[^\n]*(webui|--webui|8080)' "$wf"; then
            echo 'F12-3: magnet wiring must not touch a torrent Web UI' >&2; exit 1
          fi
          # --- §4 VNC memory: 5x500ms retry + purge, no password in any URL ----
          grep -q 'RETRY_CAP = 5' "$shim"
          grep -q 'pending = null' "$shim"
          grep -q 'window.opener = null' "$shim"
          if grep -n 'password=' payloads/ui.html "$wf" | grep -v 'no launch URL ever carries'; then
            echo 'F12-4: a launch URL carries password=' >&2; exit 1
          fi
          grep -q 'compression=6' payloads/ui.html
          grep -q "postMessage({type:'ghrdp-vnc-pass',pass:pass},origin)" payloads/ui.html
          # --- §5 timer / latency / hidden console -----------------------------
          grep -q 'PreferZlib' "$wf"
          grep -q 'rdpUsageActive' payloads/ghrdp-server.ps1
          grep -q "UserId 'SYSTEM'" "$wf"
          grep -q 'UDP 41641' payloads/ui.html
          # --- §6 setup minutes + setup-phase caches ---------------------------
          grep -q 'Setup time report (F11-6)' "$wf"
          grep -q 'C:\\ghrdp\\novnc' "$wf"
          grep -q 'ghrdp-rust\\target' "$wf"
          grep -q 'tightvnc-2.8.85.msi' "$wf"
          # --- §7 lab proof-matrix cells exist ---------------------------------
          grep -q 'K: browser policies + extensions readback' "$lab"
          grep -q 'L: qBittorrent .torrent/magnet default' "$lab"
          grep -q 'M: zero console windows' "$lab"
          grep -q 'N: handler overwrite (stale value planted)' "$lab"
          echo 'F12 gates PASS'

      - name: F14 one-click kit gates (dl allowlist, PS-free install.cmd, 2-file zip, on-page guide)
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          srv=payloads/ghrdp-server.ps1
          # §2 allowlist stays EXACTLY the three kit objects - any wider list fails.
          test "$(grep -cF 'script:DlNames = @(' "$srv")" -eq 1
          al=$(grep -F 'script:DlNames = @(' "$srv")
          test "$(grep -oE "'[^']+'" <<< "$al" | wc -l)" -eq 3
          for n in 'ghrdp-handler-kit.zip' 'install.cmd' 'ghrdp-rdp-launcher.cs'; do
            grep -q "'$n'" <<< "$al"
          done
          grep -qF 'script:DlNames -notcontains $dlName' "$srv"
          grep -qF 'Content-Disposition: attachment; filename=' "$srv"
          # §2/§7 no secrets object on /dl: config/dash-token names must never
          # appear in the allowlist line.
          if grep -Eiq 'config|token|pass|key' <<< "$al"; then
            echo 'F14: /dl allowlist must never name a secrets-bearing file' >&2; exit 1
          fi
          # §4 install.cmd: byte-faithful F14 text has NO powershell invocation.
          # The mandated DONE line must print literally "NOT powershell.", so
          # the gate bans INVOCATION forms (command position / .exe / -flag),
          # not the bare word naming the old handler.
          if grep -Eiq '(^|[&|( ])powershell([ "]|$)|powershell\.exe|-ExecutionPolicy' payloads/install.cmd; then
            echo 'F14: install.cmd runs a script host' >&2; exit 1
          fi
          # §1/§4 zip build lists EXACTLY the two payloads - never a third file.
          kit=$(awk '/name: Build ghrdp-handler-kit.zip \(F14\)/{f=1;next} /^      - name: /{f=0} f' "$wf")
          test -n "$kit"
          test "$(grep -c 'Copy-Item' <<< "$kit")" -eq 2
          ca=$(grep 'Compress-Archive' <<< "$kit")
          test "$(grep -oE "Join-Path \\\$stage '[^']+'" <<< "$ca" | wc -l)" -eq 2
          grep -qF "Join-Path \$stage 'install.cmd'" <<< "$ca"
          grep -qF "Join-Path \$stage 'ghrdp-rdp-launcher.cs'" <<< "$ca"
          grep -qF 'ghrdp-handler-kit.zip' <<< "$kit"
          grep -qF -- '-ne 2' <<< "$kit"     # entry-count readback fails closed
          # §3 on-page one-click button + ordered guide + Path B note.
          grep -qF 'href="/dl/ghrdp-handler-kit.zip"' payloads/ui.html
          grep -q 'DOWNLOAD INSTALL KIT' payloads/ui.html
          grep -q 'id="btnKitDl"' payloads/ui.html
          grep -q 'id="kitGuideA"' payloads/ui.html
          grep -q 'id="kitPathB"' payloads/ui.html
          grep -q 'Security Warning' payloads/ui.html
          grep -q 'Mark-of-the-Web' payloads/ui.html
          grep -q 'ghrdp-rdp-launcher.exe</code>, NOT powershell' payloads/ui.html
          # WEB DESKTOP stays the zero-install primary; stale notice untouched.
          grep -qF 'WEB DESKTOP (primary)' payloads/ui.html
          grep -q 'id="winAutoStale"' payloads/ui.html
          echo 'F14 gates PASS'

      - name: F15 fail-visible launcher gates (visible cmdkey/mstsc, hello-before-work, check self-test)
        shell: bash
        run: |
          set -euo pipefail
          cs=payloads/ghrdp-rdp-launcher.cs
          cmd=payloads/install.cmd
          # --- §1.2/§1.3/§7 no hidden window may wrap cmdkey or mstsc ---------
          # (a) no executable line may carry a hidden-window process flag at all;
          #     the bans may be NAMED in comments only.
          if grep -v '^[[:space:]]*//' "$cs" | grep -n 'CreateNoWindow\|WindowStyle\.Hidden'; then
            echo 'F15: a hidden-window process flag survives in launcher code' >&2; exit 1
          fi
          # (b) and no mention of one - comment or code - may sit next to the
          #     credential or client code (±4 lines of cmdkey/mstsc): the gate
          #     must never be satisfiable by a well-commented hidden launch.
          adj=$(awk '{ l[NR]=$0 } END {
            for (n=1; n<=NR; n++) {
              if (l[n] ~ /CreateNoWindow|WindowStyle\.Hidden/) {
                for (i=n-4; i<=n+4; i++) if (i in l && l[i] ~ /cmdkey|mstsc/ && l[i] !~ /^[[:space:]]*\/\//) { print n; break }
              }
            }
          }' "$cs")
          if [ -n "$adj" ]; then
            echo "F15: hidden-window flag adjacent to cmdkey/mstsc (line $adj)" >&2; exit 1
          fi
          # (c) the credential prompt and the client are launched VISIBLY.
          grep -q 'ProcessWindowStyle.Normal' "$cs"
          test "$(grep -c 'UseShellExecute = true' "$cs")" -ge 2
          grep -q 'psi.WorkingDirectory = Environment.SystemDirectory' "$cs"
          grep -q 'CmdkeyTimeoutMs = 180000' "$cs"
          grep -q 'WaitForExit(waitMs)' "$cs"
          grep -qF '/pass")' "$cs"
          grep -q 'cmdkey.exe", "/list"' "$cs"
          grep -q 'm.WaitForExit(2000)' "$cs"
          # --- §1.1 hello-before-work inside Main ------------------------------
          main_body=$(awk '
            /private static int Main\(/ { f=1 }
            f { line=$0; o=gsub(/\{/,"{",line); c=gsub(/\}/,"}",line); d+=o-c; print; if (d>0) started=1; if (started && d==0) exit }
          ' "$cs")
          test -n "$main_body"
          grep -q 'hello-before-work' <<< "$main_body"
          grep -q 'LogJson("invoked"' <<< "$main_body"
          grep -q 'HelloBounded(beaconHost, port, verb, true, "invoked")' <<< "$main_body"
          # [F15 §1.1+§7] the beacon host is the URL server arg CLAMPED to a *.ts.net
          # FQDN (pure string check, so it still precedes all work): a random URI
          # must not turn the launcher into a POST-to-anywhere primitive.
          grep -qF 'string beaconHost = FqdnRe.IsMatch(server) ? server : "";' <<< "$main_body"
          grep -qF 'DoWork(uri, verb, beaconHost, port)' <<< "$main_body"
          beacon=$(awk '/LogJson\("invoked"/{print NR; exit}' <<< "$main_body")
          work=$(awk '/DoWork\(|CmdkeyStep\(|MstscStep\(|RunCheck\(|File\./ {print NR; exit}' <<< "$main_body")
          test -n "$beacon"
          test -n "$work"
          test "$beacon" -lt "$work"
          # --- §1.4 global catch: the ONLY visible-surface primitive, logged ----
          test "$(grep -c 'MessageBox.Show' "$cs")" -eq 1
          grep -q 'catch (Exception ex)' <<< "$main_body"
          grep -q 'ShowBox("ghrdp launcher error"' <<< "$main_body"
          grep -q 'ex.GetType().Name' <<< "$main_body"
          # every dialog is logged before it is shown, and the only suppression
          # is the lab-named headless switch (production always shows it).
          grep -q 'LogJson("msgbox"' "$cs"
          grep -q 'GHRDP_LAB_NOMSG' "$cs"
          if grep -n 'NOMSG' "$cs" | grep -v 'GHRDP_LAB_NOMSG'; then
            echo 'F15: an unnamed headless dialog switch appeared' >&2; exit 1
          fi
          # --- §1.6 JSONL log + redaction + mstsc-exit diagnosis ---------------
          grep -q 'ghrdp-launcher.log' "$cs"
          grep -q 'File.AppendAllText(LogPath()' "$cs"
          grep -q '\[redacted\]' "$cs"
          grep -q 'mstsc-exited=' "$cs"
          grep -q 'TailLines(5)' "$cs"
          grep -q 'cmdkey-stored=' "$cs"
          grep -q 'cmdkey-shown' "$cs"
          grep -q 'mstsc-started pid=' "$cs"
          # --- §2 install.cmd self test: a MessageBox MUST appear ---------------
          grep -qF 'start "" "%EXE%" "ghrdp://check"' "$cmd"
          grep -qi 'if no MessageBox appeared, Defender or policy blocked the exe' "$cmd"
          grep -qF 'ghrdp-launcher.log' "$cmd"
          # --- §3 dashboard: beacon row + 45s stall verdict + [RUN CHECK] -------
          grep -q 'id="winBeacon"' payloads/ui.html
          grep -q 'id="winBeaconStall"' payloads/ui.html
          grep -q 'BEACON_STALL_MS=45000' payloads/ui.html
          grep -qF "det==='invoked'" payloads/ui.html
          grep -q "launcher stalled at: " payloads/ui.html
          grep -q "LAUNCHER_LOG='%LOCALAPPDATA%" payloads/ui.html
          grep -q 'id="btnRunCheck"' payloads/ui.html
          grep -qF "'ghrdp://check'" payloads/ui.html
          echo 'F15 gates PASS'

      - name: F17 RDP listener probe + client-DNS guard gates (0x904/0x7)
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          ui=payloads/ui.html
          srv=payloads/ghrdp-server.ps1
          cs=payloads/ghrdp-rdp-launcher.cs
          lab=.github/workflows/autologin-lab.yml
          # --- §1/§4 main.yml must carry the §1 probe step AND its loud fail --
          probe=$(awk '/name: RDP listener self-probe \(F17/{f=1;next} f && /^      - name: /{exit} f' "$wf")
          test -n "$probe" || { echo 'F17: main.yml lacks the RDP listener self-probe step' >&2; exit 1; }
          for tok in 'rdpListener' 'Test-NetConnection 127.0.0.1 -Port 3389' 'Get-NetFirewallRule' 'SSLCertificateSHA1Hash' 'X509Chain' 'certChainOk' 'UserAuthentication' 'TermService' '[F17 §1 probe-begin]' '[F17 §1 probe-end]' '::error::[F17]' 'throw'; do
            grep -qF "$tok" <<< "$probe" || { echo "F17: probe step missing: $tok" >&2; exit 1; }
          done
          # the probe must write config BEFORE the loud fail (dashboard must see
          # the exact ❌ field on a red run).
          wl=$(grep -nF 'Add-Member -NotePropertyName rdpListener' <<< "$probe" | head -1 | cut -d: -f1)
          wf2=$(grep -nF '::error::[F17]' <<< "$probe" | head -1 | cut -d: -f1)
          test -n "$wl" && test -n "$wf2" && test "$wl" -lt "$wf2"
          # --- §4 fwRule scope: 100.64.0.0/10 EXACTLY, anywhere --------------
          if grep -v '^[[:space:]]*#' "$wf" | grep -n '0\.0\.0\.0/0'; then
            echo 'F17: 0.0.0.0/0 on an executable main.yml line (comments may name the ban only)' >&2; exit 1
          fi
          bad=$(grep -hoE "RemoteAddress '[^']+'" "$wf" payloads/Provision-GhrdpVps.ps1 | sort -u | grep -vF "RemoteAddress '100.64.0.0/10'" || true)
          if [ -n "$bad" ]; then echo "F17: fwRule scope differs from 100.64.0.0/10: $bad" >&2; exit 1; fi
          bad2=$(grep -hoE 'remoteip=[0-9A-Za-z./]+' "$wf" | sort -u | grep -vF 'remoteip=100.64.0.0/10' || true)
          if [ -n "$bad2" ]; then echo "F17: netsh remoteip scope differs from 100.64.0.0/10: $bad2" >&2; exit 1; fi
          # --- §2 server: RoundtripKind UTC parse + per-run reset + rdpListener
          grep -q 'RoundtripKind' "$srv" || { echo 'F17: server lacks the RoundtripKind UTC ts parse' >&2; exit 1; }
          grep -qF 'function Get-RawJsonTs' "$srv"
          grep -qF '[F17 §2] per-run beacon store' "$srv"
          grep -qF 'handler-hello-last.json' "$srv"
          # [F28 §1/§4] rdpListener is served from $rlOut (the config stamp plus
          # the live authLast/logonCollector/credsspLive additions).
          grep -qF 'rdpListener = $rlOut' "$srv"
          for tok28 in '-NotePropertyName authLast' '-NotePropertyName logonCollector' '-NotePropertyName credsspLive'; do
            grep -qF -- "$tok28" "$srv"
          done
          # --- §2 UI: UTC beacon-age parse + RDP LISTENER row + gate + diag ---
          grep -qF 'function parseTsUtc' "$ui" || { echo 'F17: ui.html beacon age parse lacks UTC handling' >&2; exit 1; }
          grep -qF 'parseTsUtc(b.ts)' "$ui"
          grep -qF 'parseTsUtc(hv)' "$ui"
          grep -qF 'id="rdpListenerRow"' "$ui"
          grep -qF 'RDP LISTENER' "$ui"
          grep -qF '__listenerOk' "$ui"
          grep -qF 'id="connDiagPing"' "$ui"
          grep -qF 'id="connDiagTnc"' "$ui"
          grep -qF "Test-NetConnection '+" "$ui"
          grep -qF "' -Port 3389'" "$ui"
          # --- §3 launcher DNS guard BEFORE any cmdkey/mstsc work ------------
          grep -qF 'Dns.GetHostAddresses' "$cs" || { echo 'F17: launcher lacks the DNS guard' >&2; exit 1; }
          grep -qF 'IsTailnetAddress' "$cs"
          grep -qF 'if (allTailnet) { return null; }' "$cs" || { echo 'F17: mixed DNS answers must be blocked' >&2; exit 1; }
          grep -qF 'every answer must be in 100.64.0.0/10' "$cs"
          grep -qF 'dns-guard' "$cs"
          grep -qF 'flushdns' "$cs"
          grep -qF '100.64.0.0/10' "$cs"
          grep -qF 'GHRDP_LAB_DNS_ALLOW_LOOPBACK' "$cs"
          guard=$(grep -nF 'string dnsProblem = DnsGuardReason(server);' "$cs" | head -1 | cut -d: -f1)
          # [F28 §3] CmdkeyStep now returns the store OUTCOME (stored | missing |
          # abort) instead of an exit code; the pinned call shape moved with it.
          call=$(grep -nF 'CmdkeyStep(server, user, host, port);' "$cs" | head -1 | cut -d: -f1)
          test -n "$guard" && test -n "$call" && test "$guard" -lt "$call"
          # lab switches stay lab-only: the lab sets the relaxation, production
          # never carries ANY GHRDP_LAB_ switch.
          grep -qF 'GHRDP_LAB_DNS_ALLOW_LOOPBACK' "$lab"
          if grep -q 'GHRDP_LAB_' "$wf"; then
            echo 'F17: a lab-only GHRDP_LAB_ switch leaked into production main.yml' >&2; exit 1
          fi
          echo 'F17 gates PASS'

      - name: F18 runner FQDN self-test + client DNS diagnostics
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          ui=payloads/ui.html
          srv=payloads/ghrdp-server.ps1
          cs=payloads/ghrdp-rdp-launcher.cs
          step=$(awk '/name: Runner FQDN self-test \(F18/{f=1;next} f && /^      - name: /{exit} f' "$wf")
          test -n "$step" || { echo 'F18: main.yml lacks Runner FQDN self-test' >&2; exit 1; }
          grep -qF 'Resolve-DnsName' <<< "$step"
          grep -qF "Runner cannot resolve own FQDN" <<< "$step"
          grep -qF 'throw' <<< "$step"
          grep -qF 'Runner FQDN resolves to' <<< "$step"
          grep -qF 'RUNNER_RESOLVED_IP=' <<< "$step"
          grep -qF 'runnerResolvedIP' "$wf"
          grep -qF 'runnerResolvedIP' "$srv"
          grep -qF "reasons += 'runner-dns-broken'" "$srv"
          grep -qF 'CONNECTION DIAGNOSTICS' "$ui"
          # [F20 §1] the DNS copy-line is Resolve-DnsName (DNS client service, so
          # Tailscale NRPT split-DNS applies); nslookup is retired as a diagnostic.
          grep -qF 'id="connDiagRd"' "$ui"
          grep -qF 'id="connDiagResolved"' "$ui"
          grep -qF 'Runner DNS broken' "$ui"
          grep -qF '__runnerDnsOk' "$ui"
          grep -qF 'Dns.GetHostAddresses' "$cs"
          grep -qF 'DNS resolution failed' "$cs"
          grep -qF 'DNS returned non-tailnet IP' "$cs"
          grep -qF 'DNS resolved ' "$cs"
          echo 'F18 gates PASS'

      - name: F19 client-DNS probe + launcher version guard + no-credential-automation gates
        shell: bash
        run: |
          set -euo pipefail
          ui=payloads/ui.html
          cs=payloads/ghrdp-rdp-launcher.cs
          srv=payloads/ghrdp-server.ps1
          wf=.github/workflows/main.yml
          mig=docs/MIGRATION.md
          # --- §4(a) NO CREDENTIAL-UI AUTOMATION, repo-wide -------------------
          # AE1: keyboard/UI-automation primitives have NO legitimate use here
          # and are banned outright, comments included (scan scope excludes THIS
          # file, which must be able to name what it bans).
          if grep -rInE 'SendKeys|UIAutomation|AutomationElement|ValuePattern|keybd_event|mouse_event|SetCursorPos|AppActivate' payloads docs tests .github/workflows/main.yml .github/workflows/autologin-lab.yml .github/workflows/webdesk-lab.yml .github/workflows/apply-patch.yml; then
            echo 'F19: credential-UI automation token found (no password typing, no credential-dialog automation anywhere)' >&2
            exit 1
          fi
          # AE2: PASSWORD AUTO-TYPE PATTERN - an injection primitive within 40
          # chars of a credential target (either order) is banned in every
          # shipped payload/workflow/test. Human-facing copy such as "type the
          # password at the Windows prompt" is legitimate and NOT matched: only
          # the API identifiers are, so nothing here can ever type a password.
          if grep -rInEi '(password|passwd|pwd|credential|cmdkey|windowspass).{0,40}(sendinput|keybd_event|mouse_event|setcursorpos|valuepattern|uiautomation|automationelement|sendkeys)|(sendinput|keybd_event|mouse_event|setcursorpos|valuepattern|uiautomation|automationelement|sendkeys).{0,40}(password|passwd|pwd|credential|cmdkey|windowspass)' payloads tests .github/workflows/main.yml .github/workflows/autologin-lab.yml .github/workflows/webdesk-lab.yml .github/workflows/apply-patch.yml; then
            echo 'F19: password auto-type pattern found (injection primitive next to a credential target)' >&2
            exit 1
          fi
          # AE3: the ONE input-injection primitive left in the tree (SendInput,
          # used by the WEB DESKTOP remote-control path) must stay credential-
          # and cmdkey-free: remote input may never be aimed at a credential UI.
          for f in $(grep -rlE 'SendInput' payloads tests .github/workflows --exclude=launch-gates.yml 2>/dev/null || true); do
            if grep -qEi 'password|passwd|pwd|credential|cmdkey|windowsPass' "$f"; then
              echo "F19: $f mixes SendInput with a credential/cmdkey reference - remote input must never target a credential UI" >&2
              exit 1
            fi
          done
          # Repo-wide denylist: retired/debug launchers and docs must not reintroduce
          # credential-ish query parameters either (the current UI gets stricter
          # single-builder checks below; launch-gates.yml itself is excluded).
          url_sources=(payloads docs tests .github/workflows/main.yml .github/workflows/autologin-lab.yml .github/workflows/webdesk-lab.yml .github/workflows/apply-patch.yml)
          if git grep -nE 'ghrdp://' -- "${url_sources[@]}" | grep -Ei '[?&](password|passwd|pwd|token|secret|authkey|api[_-]?key)='; then
            echo 'F19: repository contains a ghrdp:// URL with a credential or token parameter' >&2
            exit 1
          fi
          # --- §4(b) a ghrdp:// URL can NEVER carry a password/token -----------
          if grep -nE "ghrdp://rdp\?[^'\"]*(pass|pwd|token|secret|apikey|authkey)[=:]" "$ui"; then
            echo 'F19: a ghrdp:// URL template carries a credential-ish parameter' >&2
            exit 1
          fi
          grep -qF 'function ghrdpRdpUrl(fqdn,user,ip)' "$ui" || { echo 'F19: ui.html lacks the single ghrdp:// URL builder' >&2; exit 1; }
          builder=$(awk '/^function ghrdpRdpUrl\(/{f=1} f{print} f && /^}$/{exit}' "$ui")
          test -n "$builder" || { echo 'F19: the ghrdp:// builder body could not be extracted' >&2; exit 1; }
          grep -qF "u+='&ip='" <<< "$builder" || { echo 'F19: the builder never appends the tailnet IP' >&2; exit 1; }
          if grep -qEi '(pass|pwd|token|secret|apikey|authkey)=' <<< "$builder"; then
            echo 'F19: the ghrdp:// builder can emit a credential-ish parameter' >&2; exit 1
          fi
          # the builder may emit server|user|ip only - the launcher refuses the rest.
          grep -qF 'CredentialParamName' "$cs" || { echo 'F19: launcher does not refuse credential URL params' >&2; exit 1; }
          grep -qF 'cred-param-rejected' "$cs"
          grep -qF 'pass|password|passwd|pwd|token|key|secret|apikey|authkey|cred' "$cs"
          # exactly ONE executable template (comments may show the shape).
          test "$(grep -cF "'ghrdp://rdp?server='+encodeURIComponent(fqdn)" "$ui")" -eq 1 || { echo 'F19: ui.html must carry exactly one ghrdp://rdp URL template' >&2; exit 1; }
          # --- §1 the client-DNS probe exists, is copy-only and bounded --------
          grep -qF '[F19 §1 client-DNS probe-begin]' "$ui" || { echo 'F19: ui.html lacks the client-DNS probe block' >&2; exit 1; }
          grep -qF '[F19 §1 client-DNS probe-end]' "$ui"
          grep -qF 'function clientDnsCore(fqdn,ip,scheme,aOk,bOk)' "$ui"
          grep -qF "verdict:'client-dns-off'" "$ui" || { echo 'F19: the probe core never returns the client-dns-off verdict' >&2; exit 1; }
          grep -qF "YOUR PC's Tailscale DNS is off (name not resolvable, IP reachable)" "$ui"
          grep -qF 'client DNS ok' "$ui"
          grep -qF "mode:'no-cors'" "$ui"
          grep -qF 'CDNS_TIMEOUT_MS=3000' "$ui"
          grep -qF 'CDNS_PERIOD_MS=30000' "$ui"
          grep -qF 'clientDnsProbeUrls' "$ui"
          grep -qF "tailscale set --accept-dns=true" "$ui"
          grep -qF "ipconfig /flushdns" "$ui"
          grep -qF 'Use Tailscale DNS' "$ui"
          grep -qF 'id="clientDnsRow"' "$ui"
          grep -qF 'id="clientDnsFix1"' "$ui"
          # --- §2 launcher version guard: repo constant -> config -> status ----
          grep -qF 'private const string Ver = ' "$cs" || { echo 'F19: launcher version constant missing' >&2; exit 1; }
          grep -qF 'launcherVersion = $launcherVer' "$wf" || { echo 'F19: main.yml does not write config.launcherVersion from the launcher source' >&2; exit 1; }
          grep -qF "private const string Ver = " "$wf"
          grep -qF 'launcherVersion' "$srv"
          grep -qF 'launcherOutdated' "$srv"
          grep -qF 'launcherSeenVersion' "$srv"
          grep -qF '"exe"' "$srv"
          grep -qF "(s&&s.launcherOutdated===true)?'':'none'" "$ui" || { echo 'F19: the UI does not drive the outdated row from launcherOutdated' >&2; exit 1; }
          grep -qF 'id="nrLauncherOutdatedRow"' "$ui"
          grep -qF 'launcher outdated - re-run install.cmd once' "$ui"
          # the beacon carries the exe stamp and the server compares NUMERICALLY.
          grep -qF ',\"exe\":\"' "$cs" || { echo 'F19: launcher beacon does not carry the exe version stamp' >&2; exit 1; }
          grep -qF "[version]\$launcherSeenVersion -lt [version]\$launcherVersion" "$srv" || { echo 'F19: server does not compare launcher versions numerically' >&2; exit 1; }
          # --- §2 launcher DNS-off remediation (IP diagnosis, FQDN target) -----
          grep -qF 'return "client-dns-off";' "$cs" || { echo 'F19: launcher lacks the client-dns-off verdict' >&2; exit 1; }
          grep -qF 'false, "client-dns-off"' "$cs" || { echo 'F19: the client-dns-off beacon detail is missing' >&2; exit 1; }
          grep -qF 'DnsDecision' "$cs"
          grep -qF 'TailnetIpFromUri' "$cs"
          grep -qF 'Your Tailscale DNS is off. Run once: tailscale set --accept-dns=true' "$cs"
          grep -qF 'RdpPort = 3389' "$cs"
          grep -qF 'GHRDP_LAB_TCP_RESULT' "$cs"
          grep -qF 'GHRDP_LAB_DNS_RESULT' "$cs"
          grep -qF -- '--dns-selftest' "$cs"
          # the mstsc target MUST stay the FQDN: the IP may only be diagnosed.
          grep -qF 'return MstscStep(server, user, host, port);' "$cs" || { echo 'F19: mstsc target must stay the FQDN' >&2; exit 1; }
          if grep -nE 'ProcessStartInfo\("mstsc\.exe", *"\\"?" *\+ *dnsIp' "$cs"; then
            echo 'F19: mstsc was pointed at the diagnosis IP' >&2; exit 1
          fi
          # --- §3 the code-signed .rdp plan stays DOCUMENTED, never implemented
          grep -qF '### 1.11 [F19 §3] Code-signed' "$mig" || { echo 'F19: MIGRATION.md lacks the §1.11 code-signed .rdp note' >&2; exit 1; }
          grep -qF 'OPTIONAL FUTURE, NOT IMPLEMENTED' "$mig"
          grep -qF 'rdpsign' "$mig"
          # --- lab switches stay lab-only ---------------------------------------
          if grep -q 'GHRDP_LAB_' "$wf"; then
            echo 'F19: a lab-only GHRDP_LAB_ switch leaked into production main.yml' >&2; exit 1
          fi
          # --- §5 the launcher guard is really EXECUTED (csc + injected matrix) --
          grep -qF 'name: F19 launcher DNS-guard decision matrix (csc compile + injected resolver)' .github/workflows/launch-gates.yml \
            || { echo 'F19: the launcher decision matrix step is missing from windows-native' >&2; exit 1; }
