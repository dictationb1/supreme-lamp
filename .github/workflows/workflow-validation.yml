name: Workflow & Script Validation

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'

jobs:
  validate:
    name: Validate Workflows and Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run Workflow & Script Validator
        run: node scripts/validate-workflows.mjs

      - name: Run Validator Unit Tests
        run: node --test tests/workflow-validator.test.js tests/workflow-pwsh-parser.test.js tests/workflow-shell-syntax.test.js
