      - name: F20 nslookup false alarm killed + evidence-based 0x904 fallback
        shell: bash
        run: |
          set -euo pipefail
          ui=payloads/ui.html
          cs=payloads/ghrdp-rdp-launcher.cs
          # --- §1 nslookup is no longer OFFERED as a diagnostic ----------------
          # The correction note may NAME nslookup (that note IS the fix); the
          # command must never appear inside a <code> copy-line the user is told
          # to run, and the retired element id must not come back.
          if grep -nE '<code[^>]*>[^<]*nslookup' "$ui"; then
            echo 'F20: ui.html still offers nslookup as a diagnostic copy-line' >&2
            exit 1
          fi
          if grep -qF 'id="connDiagNs"' "$ui"; then
            echo 'F20: the retired nslookup copy-line element survived' >&2
            exit 1
          fi
          grep -qF 'id="connDiagRd"' "$ui" || { echo 'F20: Resolve-DnsName copy-line missing' >&2; exit 1; }
          grep -qF 'Resolve-DnsName &lt;fqdn&gt;' "$ui"
          grep -qF "dn.textContent='Resolve-DnsName '+diagF" "$ui" || { echo 'F20: the copy-line is not wired to the live FQDN' >&2; exit 1; }
          grep -qF 'nslookup bypasses Tailscale split-DNS' "$ui" || { echo 'F20: the nslookup false-alarm note is missing' >&2; exit 1; }
          grep -qF 'a nslookup timeout while ping works is EXPECTED and not a fault' "$ui"
          # ping + Test-NetConnection stay exactly as they were.
          grep -qF 'id="connDiagPing"' "$ui"
          grep -qF 'id="connDiagTnc"' "$ui"
          # --- §2 evidence-based 0x904/0x7 fallback ----------------------------
          grep -qF 'if mstsc still fails (0x904/0x7)' "$ui" || { echo 'F20: the 0x904/0x7 fallback block is missing' >&2; exit 1; }
          # collapsed by default (never the first thing to try) + copy-only.
          grep -qF '<details id="connDiagFailBox"' "$ui" || { echo 'F20: the fallback block is not collapsed' >&2; exit 1; }
          grep -qF '<summary' "$ui"
          blk=$(awk '/id="connDiagRow"/{f=1} f{print} f && /^  <\/div>$/{exit}' "$ui")
          test -n "$blk" || { echo 'F20: the CONNECTION DIAGNOSTICS row could not be extracted' >&2; exit 1; }
          grep -qF 'if mstsc still fails (0x904/0x7)' <<< "$blk" || { echo 'F20: the fallback block is not inside CONNECTION DIAGNOSTICS' >&2; exit 1; }
          for tok in \
            'wevtutil epl Microsoft-Windows-TerminalServices-ClientActiveXCore/Operational %TEMP%\rdp-client.evtx' \
            'wevtutil el | findstr /i "terminal credssp schannel"' \
            'wevtutil epl Security %TEMP%\rdp-security.evtx /q:"*[System[(EventID=4624 or EventID=4625)]]"' \
            "wevtutil epl System %TEMP%\rdp-system.evtx /q:\"*[System[Provider[@Name='Schannel']]]\"" \
            'wevtutil epl Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational %TEMP%\rdp-termgr.evtx' \
            'Paste the exports into this session'
          do
            grep -qF "$tok" <<< "$blk" || { echo "F20: fallback block missing export line: $tok" >&2; exit 1; }
          done
          # copy-only + no execution token (the page never runs anything) + no
          # NLA/CredSSP/cert weakening suggestion anywhere in the row.
          if grep -oE 'onclick="[^"]*"' <<< "$blk" | grep -v '^onclick="copyById' | grep .; then
            echo 'F20: a non-copy control appeared inside CONNECTION DIAGNOSTICS' >&2
            exit 1
          fi
          if grep -nEi 'powershell|mshta|wscript|cscript|Invoke-Expression|iex ' <<< "$blk"; then
            echo 'F20: an execution token appeared inside CONNECTION DIAGNOSTICS' >&2
            exit 1
          fi
          # [F21] The F21 CredSSP diagnostics box also contains a prohibition
          # warning naming "bypass cert validation" — that warning IS the fix,
          # not a suggestion to weaken; exclude it from the weakening scan.
          weak=$(grep -nEi 'authentication level|enablecredsspsupport|authlvloverride|prompt for credentials|certificate.*bypass|bypass.*cert' <<< "$blk" | grep -v 'NEVER weaken NLA' || true)
          if [ -n "$weak" ]; then
            echo 'F20: the fallback block suggests weakening NLA/CredSSP/cert validation' >&2
            echo "$weak" >&2
            exit 1
          fi
          # --- §2 launcher: exit code logged + dashboard pointer in the dialog --
          grep -qF 'mstsc exited within 2s, code=' "$cs" || { echo 'F20: the mstsc exit code is not logged' >&2; exit 1; }
          # (the C# source carries the escaped form \"if mstsc still fails\").
          grep -qF 'see dashboard -> CONNECTION DIAGNOSTICS -> \"if mstsc still fails\" and send the exports' "$cs" || { echo 'F20: the launcher dialog lacks the dashboard pointer' >&2; exit 1; }
          grep -qF 'mstsc exit code ' "$cs"
          # the exe changed, so the repo constant it stamps into every beacon
          # MUST be at least the F20 build (else no client is ever told to update).
          ver=$(grep -oE 'private const string Ver = "[0-9]+(\.[0-9]+){1,3}"' "$cs" | grep -oE '[0-9]+(\.[0-9]+){1,3}' | head -1)
          test -n "$ver" || { echo 'F20: the launcher version constant is missing' >&2; exit 1; }
          test "$(printf '2.3.0.0\n%s\n' "$ver" | sort -V | head -1)" = '2.3.0.0' || { echo "F20: launcher version $ver predates the F20 build" >&2; exit 1; }
          # --- §3 the standing bans still hold on the touched surfaces ----------
          if grep -InE 'SendKeys|UIAutomation|AutomationElement|ValuePattern|keybd_event' "$ui" "$cs"; then
            echo 'F20: credential-UI automation token found' >&2
            exit 1
          fi
          if grep -nE "ghrdp://rdp\?[^'\"]*(pass|pwd|token|secret|apikey|authkey)[=:]" "$ui"; then
            echo 'F20: a ghrdp:// URL carries a credential parameter' >&2
            exit 1
          fi
          if grep -nE 'powershell\.exe|-ExecutionPolicy|Invoke-Expression|-EncodedCommand' "$ui"; then
            echo 'F20: a script-host launch token reached the page' >&2
            exit 1
          fi
          echo 'F20 gates PASS'

      - name: F21 CredSSP/NLA handshake verification gates
        shell: bash
        run: |
          # shellcheck disable=SC2013,SC2015,SC2016,SC2034,SC2088
          set -euo pipefail
          wf=.github/workflows/main.yml
          ui=payloads/ui.html
          cs=payloads/ghrdp-rdp-launcher.cs
          # --- §1 SERVER-SIDE CREDENTIAL PROOF (ValidateCredentials + loud fail) --
          step=$(awk '/name: Server-side credential proof \(F24/{f=1;next} f && /^      - name: /{exit} f' "$wf")
          test -n "$step" || { echo 'F24: main.yml lacks the server-side credential proof step' >&2; exit 1; }
          for tok in 'ValidateCredentials' 'System.DirectoryServices.AccountManagement' "PrincipalContext('Machine')" 'credValid' 'credValidProbeError' 'Write-CredValid' '::error::[F24]' 'server-side credential invalid - user creation bug' 'throw'; do
            grep -qF -- "$tok" <<< "$step" || { echo "F24: credential proof step missing token: $tok" >&2; exit 1; }
          done
          # the PROBE itself (not just a mention): the SDAM context + the exact
          # credential-validation call must be there.
          grep -qF "\$ctx = New-Object System.DirectoryServices.AccountManagement.PrincipalContext('Machine')" <<< "$step" || { echo 'F24: the SDAM PrincipalContext(machine) probe is missing' >&2; exit 1; }
          grep -qF '$valid = [bool]$ctx.ValidateCredentials($UserName, $Password)' <<< "$step" || { echo 'F24: the ValidateCredentials call is missing' >&2; exit 1; }
          # the verdict is stamped BEFORE the loud fail (the dashboard must see it)
          wl=$(grep -nF 'Write-CredValid -Valid $valid' <<< "$step" | head -1 | cut -d: -f1)
          ff=$(grep -nF 'server-side credential invalid - user creation bug' <<< "$step" | head -1 | cut -d: -f1)
          test -n "$wl" && test -n "$ff" && test "$wl" -lt "$ff" || { echo 'F24: credValid is not written before the loud fail' >&2; exit 1; }
          # the proof never prints credential material (field names only)
          if grep -nE '(Write-Host|Add-Content)[^$]*(RDP_PASS|RDP_USER)' <<< "$step"; then
            echo 'F24: the credential proof prints credential material' >&2; exit 1
          fi
          # --- §2 THE SECRET-FREE 60s 4625 COLLECTOR -----------------------------
          col=$(awk '/\[F24 §2 collector-begin\]/{f=1;next} /\[F24 §2 collector-end\]/{exit} f' "$wf")
          test -n "$col" || { echo 'F24: main.yml lacks the F24 §2 collector block (markers)' >&2; exit 1; }
          for tok in 'Get-WinEvent' "LogName = 'Security'" '4624' '4625' '0XC000006A' '0XC000006D' '0XC000015B' 'wrong-password' 'authEvents' 'Get-RdpAuthEventSummary' 'Get-RdpAuthEventFields'; do
            grep -qF -- "$tok" <<< "$col" || { echo "F24: collector missing token: $tok" >&2; exit 1; }
          done
          for leak in 'RDP_PASS' 'RDP_USER' 'env:RDP_' 'SubjectUserName' 'Password' 'IpAddress'; do
            if grep -qF -- "$leak" <<< "$col"; then
              echo "F24: collector references credential/identity material: $leak" >&2; exit 1
            fi
          done
          grep -qF 'Update-RdpAuthEvents -CfgPath $cfgPath' "$wf" || { echo 'F24: the collector never ticks in the keep-alive loop' >&2; exit 1; }
          # --- §3b the F17 rebuild carries the verdict fields forward -----------
          grep -qF '[F24 §3b]' "$wf" || { echo 'F24: the F17 probe does not carry the F21 verdict fields forward' >&2; exit 1; }
          # [F37] the list legitimately gained 'telescope' (the live telescope must
          # survive the F17 rebuild, exactly like the F21 verdict fields do).
          grep -qF "foreach (\$k in @('credsspStatus', 'credsspWhy', 'credValid', 'credValidAt', 'credValidWhy', 'credValidProbeError', 'authEvents', 'telescope'))" "$wf" || { echo 'F24: the carry-forward field list is wrong (all F21 verdict fields + the F37 telescope)' >&2; exit 1; }
          # --- §3 ONE decision row with the three branches -----------------------
          grep -qF 'id="rdpAuthRow"' "$ui" || { echo 'F24: ui.html lacks the auth-reject discriminator row' >&2; exit 1; }
          for tok in 'SERVER credential bug - re-dispatch' 'YOUR stored password is stale' 'copy CURRENT password from KEYS' 'TLS-layer suspect' 'cmdkey /delete:TERMSRV/' 'capi2.evtx' 'system.evtx' 'authEvents' 'credValid' 'credValidProbeError' 'PROBE FAILED' 'paste the copied password EXACTLY' 'no tooling deletes credentials'; do
            grep -qF -- "$tok" "$ui" || { echo "F24: ui.html matrix missing token: $tok" >&2; exit 1; }
          done
          grep -qF "kd.textContent='cmdkey /delete:TERMSRV/'+(fqdn||'<fqdn>')" "$ui" || { echo 'F24: the cmdkey copy-line is not wired to the live FQDN' >&2; exit 1; }
          grep -qF "onclick=\"copyById('credWinPass',this)\"" "$ui" || { echo 'F24: the stale-password branch lacks the KEYS password copy-line' >&2; exit 1; }
          # the bare "FAIL: pending" credssp render must never come back
          if grep -qF "'FAIL: '+cs" "$ui"; then
            echo 'F24: ui.html renders a bare FAIL for an unreported credsspStatus' >&2; exit 1
          fi
          grep -qF 'not reported yet (F21 step: CredSSP/NLA handshake verification)' "$ui" || { echo 'F24: the pending CredSSP render is missing' >&2; exit 1; }
          # copy-only + no execution/automation + no weakening advice in the row
          blk=$(awk '/id="rdpAuthRow"/{f=1} f{print} f && /^  <\/div>$/{exit}' "$ui")
          test -n "$blk" || { echo 'F24: the discriminator row could not be extracted' >&2; exit 1; }
          if grep -oE 'onclick="[^"]*"' <<< "$blk" | grep -v '^onclick="copyById' | grep .; then
            echo 'F24: a non-copy control appeared in the discriminator row' >&2; exit 1
          fi
          if grep -nEi 'powershell|mshta|wscript|cscript|Invoke-Expression|SendKeys|UIAutomation|keybd_event' <<< "$blk"; then
            echo 'F24: an execution/automation token appeared in the discriminator row' >&2; exit 1
          fi
          if grep -nEi 'authentication level|enablecredsspsupport|authlvloverride|prompt for credentials|certificate.*bypass|bypass.*cert' <<< "$blk" | grep -v 'NEVER weaken NLA' | grep .; then
            echo 'F24: the discriminator row suggests weakening NLA/CredSSP/cert validation' >&2; exit 1
          fi
          # --- §4 locked rule: the launcher gains NO delete verb -----------------
          if grep -nE 'cmdkey[^"]*/delete' "$cs"; then
            echo 'F24: the launcher gained a credential-deletion verb (the dashboard copy-lines are the only reset path)' >&2; exit 1
          fi
          echo 'F24 gates PASS'

      - name: F8 web-desktop honesty gates
        shell: bash
        run: |
          set -euo pipefail
          # UI must not claim ready without a webdeskUrl: every non-comment
          # 'WEB DESKTOP ready' line must reference webdeskUrl on the same line.
          if grep -n 'WEB DESKTOP ready' payloads/ui.html | grep -v '^[0-9]*:[[:space:]]*//' | grep -v 'webdeskUrl'; then
            echo 'ui.html can claim WEB DESKTOP ready without webdeskUrl' >&2
            exit 1
          fi
          grep -q 'web desktop not deployed' payloads/ui.html
          grep -q 'webdeskReason' payloads/ui.html
          grep -q 'webdeskReason' payloads/ghrdp-server.ps1
          grep -q "webdeskReason = \$wdr" payloads/ghrdp-server.ps1
          # Web-desktop step must fail LOUD: all 6 skip paths record a reason.
          grep -q 'webdeskReason' .github/workflows/main.yml
          grep -q 'VNC_PASS not set - web desktop disabled' .github/workflows/main.yml
          step=$(awk '/Web desktop \(noVNC/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' .github/workflows/main.yml)
          # NOTE (all gates in this file): grep the shell variables via
          # herestring, NEVER via `printf '%s' "$var" | grep -q`. Under
          # `set -o pipefail`, grep -q's early exit SIGPIPEs printf (141),
          # which pipefail propagates, so `if ! ...` fails DESPITE the match.
          # It is scheduler-dependent (flaky across identical runs).
          n=$(grep -c "Set-WebdeskCfg ''" <<< "$step" || true)
          if [ "$n" -lt 6 ]; then
            echo "web-desktop step has silent skip paths (only $n reason writes)" >&2
            exit 1
          fi
          # No fabricated serve URL: a URL needs a real serve mapping.
          if grep -n "serveUrl = 'https://' + \$fq" .github/workflows/main.yml; then
            echo 'web-desktop step fabricates a serve URL without a mapping' >&2
            exit 1
          fi
          # Self-test step must exist and gate on the noVNC marker.
          grep -q 'Web desktop self-test' .github/workflows/main.yml
          teststep=$(awk '/Web desktop self-test/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' .github/workflows/main.yml)
          grep -q 'noVNC' <<< "$teststep"
          grep -q 'self-test PASS' <<< "$teststep"
          grep -q 'self-test FAIL' <<< "$teststep"
      - name: F9l web-desktop self-heal + diagnostics gates
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/main.yml
          # Region = the self-test step through the diagnostics steps (ends at
          # the dashboard step, exactly like the F8 gate).
          teststep=$(awk '/^      - name: Web desktop self-test/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF")
          # Assert against CODE, never against prose: comment text must not be
          # able to satisfy (or mask) a gate.
          code=$(grep -vE '^[[:space:]]*#' <<< "$teststep")
          # A) [F9n] The self-test must curl the EXACT advertised URL (the value
          #    the dashboard opens) plus the backend root on the tailnet IP.
          if ! grep -qF 'Invoke-Probe $url' <<< "$code"; then
            echo 'self-test does not curl the exact advertised URL (Invoke-Probe $url missing)' >&2
            exit 1
          fi
          if ! grep -qF -- "'backend-root'" <<< "$code"; then
            echo 'self-test lacks the backend-root probe' >&2
            exit 1
          fi
          # B) Dead backend must be healed by CALLING the idempotent launcher
          #    (the function definition alone proves nothing).
          if ! grep -qF '$started = Start-Websockify' <<< "$teststep"; then
            echo 'self-test cannot heal the backend leg ($started = Start-Websockify missing)' >&2
            exit 1
          fi
          # C) [F9n] serve is retired: no mapping reset may survive, and the
          #    classifier must capture firewall evidence (the GHRDP-Webdesk
          #    rule state) instead of serve status.
          if grep -qF -- "'--bg'" <<< "$code"; then
            echo 'self-test still carries a retired serve reset form' >&2
            exit 1
          fi
          if ! grep -q 'GHRDP-Webdesk' <<< "$code"; then
            echo 'self-test does not capture GHRDP-Webdesk firewall evidence' >&2
            exit 1
          fi
          # D) [F9n] The classification tokens must exist (diagnosis, not guessing).
          for tok in backend-dead firewall marker-missing; do
            if ! grep -q "verdict = '$tok'" <<< "$code"; then
              echo "self-test cannot classify: '$tok' missing" >&2
              exit 1
            fi
          done
          # E) Fail-closed: the halt must still write the locked codes + throw.
          if ! grep -q "\$cfgF.webdeskReason = 'serve-failed'" <<< "$code"; then
            echo 'self-test halt no longer writes webdeskReason=serve-failed' >&2
            exit 1
          fi
          if ! grep -q "throw ('Web desktop self-test FAILED" <<< "$code"; then
            echo 'self-test halt no longer throws (fail-closed)' >&2
            exit 1
          fi
          # F) The F9l-1 launcher must exist in BOTH steps as byte-identical text
          #    (a divergent copy silently changes recovery behaviour).
          n=$(grep -c '^          function Start-Websockify(' "$WF" || true)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 Start-Websockify copies (deploy + self-test), found $n" >&2
            exit 1
          fi
          h1=$(awk '/^          function Start-Websockify\(/{f=1} f{print} f && /^          \}$/{exit}' "$WF" | sha256sum | cut -d' ' -f1)
          h2=$(awk 'BEGIN{c=0} /^          function Start-Websockify\(/{c++} c==2{f=1} f{print} f && /^          \}$/{if (c==2) exit}' "$WF" | sha256sum | cut -d' ' -f1)
          if [ "$h1" != "$h2" ]; then
            echo 'the two Start-Websockify copies diverged - edit both or neither' >&2
            exit 1
          fi
          launcher=$(awk '/^          function Start-Websockify\(/{f=1} f{print} f && /^          \}$/{exit}' "$WF")
          # [F11-5.3] SUPERSEDES the F9n 'must not hide' rule: websockify is a
          # host helper, so it MUST launch hidden - the first interactive RDP
          # session must show no stray console window. The byte-identical
          # two-copy contract above is unchanged.
          if ! grep -Fq -- '-WindowStyle Hidden' <<< "$launcher"; then
            echo 'Start-Websockify must launch hidden (F11-5.3: no console window in the interactive session)' >&2
            exit 1
          fi
          # G) Survivable diagnostics: the webdesk steps must stage + upload the
          #    'webdesk-diag' artifact, and the upload path must stay inside the
          #    workspace - upload-artifact v4 rejects absolute host paths
          #    (proven by the first lab run: 'rootDirectory ... is not a parent
          #    directory of the file C:\ghrdp\webdesk\websockify.log').
          webdesk_all=$(awk '/Web desktop \(noVNC/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF" | grep -vE '^[[:space:]]*#')
          if ! grep -q 'actions/upload-artifact' <<< "$webdesk_all"; then
            echo 'web-desktop steps do not upload the diagnostics artifact' >&2
            exit 1
          fi
          if ! grep -qE '^[[:space:]]+name: webdesk-diag[[:space:]]*$' <<< "$webdesk_all"; then
            echo "web-desktop steps do not upload the 'webdesk-diag' artifact" >&2
            exit 1
          fi
          upload=$(awk '/Web desktop diagnostics artifact/{f=1} f && /^      - name: / && !/Web desktop diagnostics artifact/{exit} f' "$WF")
          if ! grep -q 'if: always()' <<< "$upload"; then
            echo 'the diagnostics upload must use if: always() (it must survive a halt)' >&2
            exit 1
          fi
          if ! grep -qE '^[[:space:]]+path: webdesk-diag[[:space:]]*$' <<< "$upload"; then
            echo 'the diagnostics upload must use the workspace-relative staging dir' >&2
            exit 1
          fi
          if grep -qE 'C:\\+ghrdp|runner\.temp' <<< "$upload"; then
            echo 'diagnostics upload uses absolute paths - upload-artifact v4 will fail (stage inside the workspace instead)' >&2
            exit 1
          fi
      - name: F9n tailnet-HTTP transport gates (serve retired for webdesk)
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/main.yml
