# [F79 D8] Run the real built UI with cached, prebuilt Chromium. No Playwright
# browser download: the Ubuntu runner's Chrome is Chromium-based and includes
# its binary/libraries. executablePath (NOT PLAYWRIGHT_BROWSERS_PATH) selects it.
name: e2e-ui
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  e2e-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies (pnpm, frozen lockfile)
        run: |
          set -euo pipefail
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          corepack enable
          pnpm install --frozen-lockfile
      - name: Cache prebuilt Chromium binary
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright/f79-chromium
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-v1
      - name: Select cached Chromium (runner Chrome on a cache miss)
        run: |
          set -euo pipefail
          browser_dir="$HOME/.cache/ms-playwright/f79-chromium"
          if [[ ! -x "$browser_dir/chrome" ]]; then
            # Chrome is prebuilt on ubuntu-latest. The APT fallback is also
            # Chromium-based, not Ubuntu's chromium-browser snap wrapper.
            if [[ ! -x /opt/google/chrome/chrome ]]; then
              sudo apt-get update
              sudo apt-get install -y google-chrome-stable
            fi
            mkdir -p "$browser_dir"
            cp -R /opt/google/chrome/. "$browser_dir/"
          fi
          "$browser_dir/chrome" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_dir/chrome" >> "$GITHUB_ENV"
      - name: Build the dashboard bundle (tsc + vite, single file)
        run: |
          set -euo pipefail
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          export VITE_BUILD_SHA="${GITHUB_SHA:-dev}"
          corepack enable
          pnpm run build
      - name: Run F78 + F79 E2E specs (real bundle + mock backend)
        # [WP-09 / #203] The 25-minute job timeout used to produce a CANCELLED
        # job with an EMPTY log: `pnpm run e2e > e2e-run.log` buffered every
        # byte into a file nobody printed, because the step only tailed it after
        # the command returned - and a cancelled job never returned. That is why
        # the hanging spec stayed unidentified for ~100 runs. Two changes:
        #   1. `tee` streams the same log to the job output LIVE, so even a
        #      cancelled or timed-out run shows the last test that started;
        #   2. `timeout 18m` bounds the step itself, so the job FAILS (and the
        #      tail + annotation below still run) instead of being killed at the
        #      job's 25m ceiling with nothing to show. 18m is a bound on the
        #      STEP, not a new per-test timeout: no test's own budget changed.
        # [F82 §2.3] Explicit bash + no `-u`; the SIGPIPE fix is below.
        shell: bash
        run: |
          # [F82 §2.3] SIGPIPE (exit 141) fix: the old `awk ... | head -c 1700`
          # fed a live pipe to a consumer that exits after 1700 bytes, so awk
          # took SIGPIPE and `set -o pipefail` propagated 141 - aborting the
          # step BEFORE the ::error:: annotation printed. The full Playwright
          # log now goes to a file and is post-processed by readers only
          # (awk, tr, iconv and tail all consume EOF; none exit early),
          # so no truncated pipeline can ever kill the step again.
          set -eo pipefail
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          corepack enable
          if ! timeout 18m pnpm run e2e 2>&1 | tee e2e-run.log; then
            echo "---- e2e-run.log tail (the lane did not finish) ----"
            tail -120 e2e-run.log
            echo "---- last test that STARTED before the lane stopped ----"
            grep -E "^\[[0-9]+/[0-9]+\]|›|\.spec\.ts" e2e-run.log | tail -20 || true
            # [WP-09 / #203] A 500-char annotation is the ONLY readable channel
            # out of this lane (the step log itself is not retrievable from the
            # agent sandbox), and a single oversized ::error:: is truncated from
            # the FRONT -- which is why the first attempt showed one test and
            # nothing else. So: emit two SHORT annotations, each under ~400
            # chars, carrying the two things that actually localise a hang.
            #
            # (a) TALLY: ok/fail per spec file. Playwright's `list` reporter
            #     prints every result line with its spec path, so one pass over
            #     the log turns "the lane is red" into "these files are red".
            # (b) LAST: the last result lines, i.e. where the run actually was
            #     when the bound hit.
            # The full tail above stays in the log for the operator, who can
            # read it.
            tally=$(awk '
              /^  [✓✘✕✗] / {
                st = $1; file = ""
                for (i = 1; i <= NF; i++) if ($i ~ /\.spec\.ts/) { file = $i; break }
                if (file != "") { sub(/:.*/, "", file); sub(/^tests\/e2e\//, "", file); c[file " " st]++ }
              }
              END { n = 0; for (k in c) { printf "%s=%d ", k, c[k]; n++ } }
            ' e2e-run.log)
            echo "::error::F79-E2E-TALLY::$(printf '%s' "$tally" | cut -c1-400)"
            # (c) FAILS: one bounded annotation PER FAILING TEST, carrying
            #     spec:line + title + the FIRST meaningful error line. The tally
            #     above names the FILE only. Without this the lane is red with no
            #     named assertion, which is exactly how tests/e2e/f84-ux.spec.ts
            #     stayed undiagnosable across runs 38027291171 -> 38057454362
            #     (the tally said "f84-ux.spec.ts ✘=4" and nothing else) while
            #     the step log stayed unreachable from the agent sandbox: only
            #     api.github.com is reachable there, and both
            #     results-receiver.actions.githubusercontent.com and
            #     pipelines.actions.githubusercontent.com are not.
            #     Sanitized by construction: Playwright's own failure header and
            #     its first assertion/timeout line only - never a request body,
            #     a response body, or a signed URL.
            : > e2e-fails.txt
            awk '
              /^  [0-9]+\) / {
                title = $0
                sub(/[[:space:]]+$/, "", title)
                err = ""
                det = ""
                while ((getline nxt) > 0) {
                  if (nxt ~ /^  [0-9]+\) /) break
                  if (err == "" && nxt ~ /^[[:space:]]+(Error|expect\(|Test timeout|locator\.|Timed out)/) {
                    err = nxt
                    gsub(/^[[:space:]]+/, "", err)
                    sub(/[[:space:]]+$/, "", err)
                    continue
                  }
                  # [#223] the assertion alone is not enough: "expect(received)
                  # .toBe(expected)" says nothing without the two values. Take
                  # the Playwright Expected/Received lines, bounded, so the next
                  # reader does not need the unreachable step log.
                  # NOTE: no apostrophes in this comment. The awk program lives
                  # inside a SINGLE-QUOTED shell string, so one apostrophe ends
                  # the string and bash parses the rest of the program as shell
                  # (that is how head 5ac45b3 died at 35s with exit code 2 and
                  # no annotations at all - job 114240714800).
                  # tests/workflow-shell-syntax.test.js runs bash -n over every
                  # bash run block to catch the class.
                  if (err != "" && nxt ~ /^[[:space:]]+(Expected|Received)/) {
                    e = nxt
                    gsub(/^[[:space:]]+/, "", e)
                    sub(/[[:space:]]+$/, "", e)
                    det = (det == "" ? e : det " | " e)
                    if (length(det) > 160) break
                  }
                }
                print title " :: " err (det == "" ? "" : " :: " det)
              }
            ' e2e-run.log > e2e-fails.txt || true
            nfail=0
            while IFS= read -r fline; do
              if [ -z "$fline" ]; then continue; fi
              nfail=$((nfail + 1))
              if [ "$nfail" -gt 4 ]; then break; fi
              echo "::error::F79-E2E-FAIL${nfail}::$(printf '%s' "$fline" | tr -d '\r' | sed 's/%/%25/g' | cut -c1-380)"
            done < e2e-fails.txt
            # `|| true`: with `set -eo pipefail` an empty grep would exit 1 here
            # and abort the step BEFORE either annotation is printed -- the exact
            # class of bug the F82 §2.3 comment above already records.
            last=$(grep -E '^  [0-9]+\)|^  [✓✘✕✗] ' e2e-run.log | tail -6 | tr '\n' '|' | tr -d '\r' | sed 's/%/%25/g' | cut -c1-400) || true
            echo "::error::F79-E2E-LAST::$last"
            exit 1
          fi
          tail -8 e2e-run.log
      # [R2 §10] The screenshots artifact lands on blob.core.windows.net, which
      # an agent sandbox cannot reach (this file already documents the same
      # constraint for the step log). A 34 MB artifact that nobody can open is
      # not visual review, so this step publishes a SHORT, readable proof of
      # what the visual lane actually captured through the one channel that IS
      # retrievable: check-run annotations, via GET
      # /repos/{owner}/{repo}/check-runs/{id}/annotations.
      #
      # It reports (a) how many r2-*.png the R2 visual spec wrote, (b) the
      # manifest's own self-declared honesty fields, and (c) the full list. It
      # FAILS the lane when the R2 spec wrote nothing, so "the lane is green"
      # can never again be read as "the visual spec ran" when it did not.
      - name: Publish R2 visual-lane proof (annotations)
        if: always()
        shell: bash
        run: |
          set -eo pipefail
          n=$(ls -1 screenshots/r2-*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "R2 screenshots written: $n"
          ls -la screenshots/r2-* 2>/dev/null || echo "(no r2 screenshots)"
          if [ -f screenshots/r2-manifest.json ]; then
            echo "---- r2-manifest.json ----"
            cat screenshots/r2-manifest.json
          fi
          # `|| true` on the greps: with `set -eo pipefail` a no-match grep would
          # abort the step before any annotation is emitted (the F82 §2.3 class
          # of bug this file already records twice).
          names=$(ls -1 screenshots/r2-*.png 2>/dev/null | xargs -r -n1 basename | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-360) || true
          realdev=$(grep -o '"realDevice"[^,]*' screenshots/r2-manifest.json 2>/dev/null | head -1 | tr -d '"\r' | cut -c1-60) || true
          echo "::notice::R2-VISUAL-COUNT::${n} r2 screenshots. ${realdev}"
          echo "::notice::R2-VISUAL-FILES::${names}"
          if [ "$n" -lt 13 ]; then
            echo "::error::R2-VISUAL-MISSING::expected at least 13 r2 screenshots, found ${n}. The R2 visual spec did not complete - do not read a green lane as visual coverage."
            exit 1
          fi
      - name: Upload screenshots (mandatory visual review)
        id: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.sha }}
          path: screenshots/
          if-no-files-found: error
          retention-days: 14
      # [V3-07 / #225] The v3 acceptance spec writes screenshots/v3-acceptance/*
      # plus a manifest that names its own evidence class. Same reasoning as the
      # R2 step above: an artifact nobody can open is not evidence, so the count
      # and the honesty fields travel through the one channel the agent sandbox
      # can read, and a spec that ran while writing NOTHING fails the lane.
      - name: Publish v3 acceptance proof (annotations)
        if: always()
        shell: bash
        run: |
          set -eo pipefail
          n=$(ls -1 screenshots/v3-acceptance/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "v3 acceptance screenshots written: $n"
          if [ -f screenshots/v3-acceptance/manifest.json ]; then
            echo "---- v3-acceptance/manifest.json ----"
            cat screenshots/v3-acceptance/manifest.json
          fi
          names=$(ls -1 screenshots/v3-acceptance/*.png 2>/dev/null | xargs -r -n1 basename | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-360) || true
          echo "::notice::V3-ACCEPTANCE-COUNT::${n} v3 acceptance screenshots. ${names}"
          if [ "$n" -lt 20 ]; then
            echo "::error::V3-ACCEPTANCE-MISSING::expected at least 20 v3 acceptance screenshots, found ${n}. The v3-acceptance spec did not complete - do not read a green lane as route coverage."
            exit 1
          fi

      - name: Publish screenshot download link
        if: always() && steps.screenshots.outputs.artifact-url != ''
        env:
          SCREENSHOTS_URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: |
          echo "Review the empty, loading, results and Your-sites screenshots BEFORE merging: $SCREENSHOTS_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the playwright report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
