# [SEARCH-REPAIR] Live (real-internet) provider probe.
#
# WHY: the authoring sandbox can only reach github.com/npm/pypi, so the real
# answers from Open Culture, archive.org, Openverse, fmhy.net and rentry.org can
# only be observed where the internet is real. This job runs the SAME requests
# the shipped adapters make, records the bodies as fixtures under
# tests/providers/fixtures/live/, writes evidence JSON, and COMMITS both back to
# the branch (run logs are not fetchable from the authoring environment).
#
# Note: workflow_dispatch is declared but the authoring token gets HTTP 403 on
# dispatch (documented in docs/reports/search-repair/README.md); a push touching
# the paths below is the trigger that works.
name: search-provider-probe
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/search-provider-probe.yml', 'scripts/provider-live-probe.mjs']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Probe providers
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p docs/reports/search-repair/evidence
          node scripts/provider-live-probe.mjs --out docs/reports/search-repair/evidence/live-probe.json 2>&1 | tee docs/reports/search-repair/evidence/live-probe.log || true
      - name: Commit evidence
        if: always()
        run: |
          set -uo pipefail
          git config user.name "search-repair-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/reports/search-repair/evidence tests/providers/fixtures/live
          if git diff --cached --quiet; then echo "no evidence change"; exit 0; fi
          git commit -m "evidence(search): live provider probe [skip ci]"
          for i in $(seq 1 8); do
            git fetch -q origin
            if git rebase -q --autostash "origin/${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed evidence on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo "::error::could not push evidence after 8 attempts"; exit 1
