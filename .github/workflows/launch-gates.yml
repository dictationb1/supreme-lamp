        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in @('payloads\ghrdp-aria2.ps1', 'tests\f56d-aria2-jsonrpc.ps1', 'tests\f56d-post-fetch-e2e.ps1', 'tests\f56d-creds-memory.ps1', 'tests\f56d-search-input.ps1')) {
