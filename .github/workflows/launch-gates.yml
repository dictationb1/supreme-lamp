              $errs = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $f), [ref]$null, [ref]$errs)
              if ($errs) {
                  foreach ($e in @($errs)) { Write-Host ('::error title=F57 parse::' + $f + ':' + $e.Extent.StartLineNumber + ':' + $e.Extent.StartColumnNumber + ' ' + $e.Message) }
                  $script:F57Failure = ('syntax error in ' + $f)
