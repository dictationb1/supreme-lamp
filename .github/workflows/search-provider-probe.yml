# [SEARCH-REPAIR] Live (real-internet) provider probe. Real-provider evidence
# for the search repair has to be produced on a machine that can reach the
# providers; this sandbox can only reach github.com/npm/pypi. The job runs
# scripts/provider-live-probe.mjs and COMMITS the report back to the branch so
# it is durable (run logs are not fetchable from the authoring environment).
name: search-provider-probe
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/search-provider-probe.yml', 'scripts/provider-live-probe.mjs']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Probe providers
        run: node scripts/provider-live-probe.mjs --out docs/reports/search-repair/evidence/live-probe.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit evidence
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/reports/search-repair/evidence/live-probe.json && git ls-files --error-unmatch docs/reports/search-repair/evidence/live-probe.json >/dev/null 2>&1; then
            echo "no change"; exit 0
          fi
          git config user.name "search-repair-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reports/search-repair/evidence/live-probe.json tests/providers/fixtures/live
          git commit -m "evidence(search): live provider probe [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
